    <style>
        :root {
            /* SUPER DARK MODE PALETTE */
            --bg-color: #000000;
            --text-color: #FFFFFF;
            --accent-gold: #FFD700;
            --highlight-bg: #1A1A1A;
            --danger-color: #FF4444;
            --success-color: #00FF7F;
            --blue-accent: #3399FF;
            --purple-accent: #B026FF; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden; /* Mencegah scroll */
            height: 100vh;
            width: 100vw;
        }

        .presentation-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 20px; /* Padding dikurangi biar muat di HP */
            padding-bottom: 80px; /* Ruang untuk tombol bawah */
            opacity: 0; visibility: hidden;
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: var(--bg-color);
            z-index: 1;
            overflow-y: auto; /* Bisa scroll kalau konten kepanjangan */
        }

        .slide.active { opacity: 1; visibility: visible; z-index: 2; }

        /* Typography */
        h1 { color: var(--accent-gold); font-size: 2.5rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        h2 { color: var(--accent-gold); font-size: 1.8rem; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 5px; }
        
        /* Module Title Slide Style */
        .module-title { font-size: 3rem; color: var(--blue-accent); font-weight: bold; border-bottom: none; margin-bottom: 10px; }
        .module-subtitle { font-size: 1.5rem; color: #FFF; letter-spacing: 3px; text-transform: uppercase; }

        p, li { font-size: 1.2rem; line-height: 1.5; max-width: 800px; margin-bottom: 10px; color: #EEE; }
        ul, ol { text-align: left; margin-left: 20px; display: inline-block; width: 90%; }
        li { margin-bottom: 8px; }
        
        strong { color: var(--success-color); font-weight: 700; }
        .danger-text { color: var(--danger-color); font-weight: bold; }
        .blue-text { color: var(--blue-accent); font-weight: bold; }
        .purple-text { color: var(--purple-accent); font-weight: bold; }

        /* Boxes */
        .highlight-box {
            background-color: var(--highlight-bg);
            border: 1px solid #444;
            border-left: 5px solid var(--accent-gold);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            width: 100%; max-width: 800px;
            text-align: left;
        }
        .highlight-box h3 { color: var(--blue-accent); font-size: 1.3rem; margin-bottom: 5px; }

        /* Checkpoint Box */
        .checkpoint-box { border-left-color: var(--danger-color); }
        .checkpoint-box h3 { color: var(--danger-color); }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 1rem; background-color: var(--highlight-bg); }
        th, td { border: 1px solid #555; padding: 8px; text-align: left; }
        th { background-color: #222; color: var(--accent-gold); font-size: 1.1rem; text-align: center; }
        
        /* Grid for Examples */
        .example-grid {
            display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 10px;
        }

        /* --- NAVIGATION FIXED (SOLUSI UTAMA) --- */
        .control-btn { 
            position: fixed; /* Wajib FIXED agar nempel di layar */
            bottom: 30px; /* Naikkan biar ga kena menu browser */
            background-color: #111; 
            color: #FFF; 
            border: 1px solid #555; 
            padding: 15px 25px; 
            border-radius: 50px; /* Tombol bulat biar enak ditekan */
            cursor: pointer; 
            font-size: 1.2rem; 
            font-weight: bold;
            z-index: 9999; /* Pastikan selalu paling atas */
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); /* Bayangan biar terlihat melayang */
        }
        .control-btn:active { background-color: var(--accent-gold); color: #000; border-color: var(--accent-gold); }
        
        .btn-prev { left: 20px; }
        .btn-next { right: 20px; background-color: #222; border-color: var(--accent-gold); color: var(--accent-gold); }

        .slide-number { 
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); 
            font-size: 1rem; color: #888; z-index: 9999; 
            background-color: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 10px;
        }
        
        .home-btn { 
            position: fixed; top: 20px; left: 20px; 
            font-size: 0.9rem; color: #AAA; text-decoration: none; 
            border: 1px solid #333; padding: 8px 12px; border-radius: 5px; 
            z-index: 9999; background-color: rgba(0,0,0,0.8);
        }

        @media (min-width: 768px) {
            /* Style khusus Laptop/Tablet */
            h1 { font-size: 3.5rem; } h2 { font-size: 2.2rem; } 
            p, li, td { font-size: 1.5rem; }
            .slide { padding: 60px; }
            .example-grid { display: grid; grid-template-columns: 1fr 1fr; }
            .control-btn { bottom: 30px; padding: 10px 20px; border-radius: 8px; }
        }
    </style>
