<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOU Module 10 Simulation (Randomized)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #4da6ff;
            --correct-color: #4caf50;
            --wrong-color: #f44336;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--accent-color); }
        p.subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px; }

        /* Card Style */
        .card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .meta-tags {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }

        .video-tag {
            background-color: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .category-tag {
            background-color: #2c3e50;
            color: #4da6ff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #4da6ff;
        }

        .question-text {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .option-label:hover {
            background-color: #2c2c2c;
            border-color: var(--accent-color);
        }

        .option-label input {
            margin-top: 5px;
            margin-right: 15px;
            accent-color: var(--accent-color);
            transform: scale(1.2);
        }

        /* Buttons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        
        .btn-nav {
            background-color: #333; 
            color: #fff; 
            border: 1px solid #555;
            margin-bottom: 15px;
        }

        .btn:hover { opacity: 0.9; }

        /* Results & Review */
        .result-box {
            text-align: center;
            padding: 40px;
        }
        
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 5px solid var(--accent-color);
        }

        .score-number { font-size: 2.2rem; font-weight: bold; color: var(--accent-color); }
        .score-label { font-size: 0.8rem; color: #aaa; margin-top: -5px; }

        .review-item {
            background-color: #252525;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 6px solid #555;
            text-align: left;
        }

        .review-item.correct { border-left-color: var(--correct-color); }
        .review-item.wrong { border-left-color: var(--wrong-color); }

        .review-explanation {
            background-color: #333; 
            border: 1px solid #FFD700; 
            padding: 15px; 
            margin-top: 15px; 
            border-radius: 8px;
        }
        
        .indonesian-flag {
            font-size: 0.95rem;
            color: #FFD700; 
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .explanation-text {
            color: #fff;
            margin: 0;
            font-size: 1rem;
            line-height: 1.5;
        }

        .step { display: none; }
        .step.active { display: block; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>IOU Module 10 Simulation</h1>
        <p class="subtitle">Plagiarism & Paraphrasing</p>
    </header>

    <form id="quizForm">
        <div id="quiz-container">
            <p style="text-align:center; color: #666;">Loading questions...</p>
        </div>
    </form>
</div>

<script>
    // DATA SOAL MODUL 10 (Belum diacak)
    // 6 C1 (10pt), 3 C2 (20pt), 3 C3 (30pt)
    
    const rawQuizData = [
        // --- C1: MENGINGAT (10 Poin) ---
        {
            id: 1,
            video: "Video 10a: Introduction",
            category: "C1 - Mengingat",
            points: 10,
            text: "According to the module, what is the fundamental definition of 'Plagiarism'?",
            options: [
                "The act of translating a text from one language to another.",
                "The act of stealing someone else's work, whether intentional or unintentional.",
                "The act of summarizing a long article into short notes.",
                "The act of reviewing a peer's academic paper for errors."
            ],
            correct: 1, 
            explanation: "Plagiarisme didefinisikan secara mendasar sebagai tindakan mencuri karya orang lain ('stealing someone else's work'), baik sengaja maupun tidak. [Video 10a]"
        },
        {
            id: 2,
            video: "Video 10a: Rules",
            category: "C1 - Mengingat",
            points: 10,
            text: "When you copy an author's exact words into your paper, what must you do to avoid plagiarism?",
            options: [
                "You must enclose them in quotation marks and provide a proper citation.",
                "You must write them in bold text to make them stand out.",
                "You must change at least one word in the sentence.",
                "You must put them in a footnote at the bottom of the page."
            ],
            correct: 0, 
            explanation: "Jika menyalin kata-kata persis (exact words), wajib menggunakan tanda kutip ('quotation marks') dan sitasi yang tepat. [Video 10a]"
        },
        {
            id: 3,
            video: "Video 10b: Avoiding Plagiarism",
            category: "C1 - Mengingat",
            points: 10,
            text: "What are the two primary methods mentioned in the module to avoid the academic offense of plagiarism?",
            options: [
                "Summarizing and Deleting.",
                "Reading and Writing.",
                "Direct Quoting and Paraphrasing.",
                "Copying and Pasting."
            ],
            correct: 2, 
            explanation: "Dua metode utama untuk menghindari plagiarisme adalah mengutip langsung ('direct quoting') atau memparafrasa ('paraphrasing'). [Video 10b]"
        },
        {
            id: 4,
            video: "Video 10c: Rules of Paraphrasing",
            category: "C1 - Mengingat",
            points: 10,
            text: "Which of the following is NOT one of the three strict criteria for a successful paraphrase?",
            options: [
                "It must use completely different vocabulary.",
                "It must have a completely different sentence structure.",
                "It must be significantly shorter than the original text.",
                "It must retain the exact original meaning."
            ],
            correct: 2, 
            explanation: "Tiga kriteria wajib adalah: kosa kata beda, struktur beda, dan makna sama. Tidak ada aturan bahwa parafrasa harus 'lebih pendek' (itu aturan ringkasan/summary). [Video 10c]"
        },
        {
            id: 5,
            video: "Video 10c: Rules of Paraphrasing",
            category: "C1 - Mengingat",
            points: 10,
            text: "When paraphrasing, what are you strictly forbidden from adding to the text?",
            options: [
                "You are not allowed to add accurate synonyms.",
                "You are not allowed to add proper grammar.",
                "You are not allowed to add your own personal opinions.",
                "You are not allowed to add citations."
            ],
            correct: 2, 
            explanation: "Aturan ketiga menyatakan: Anda tidak diizinkan menambahkan pendapat pribadi ('personal opinions'). Pesan harus tetap identik dengan aslinya. [Video 10c]"
        },
        {
            id: 6,
            video: "Video 10d: Strategies",
            category: "C1 - Mengingat",
            points: 10,
            text: "Which grammatical manipulation is suggested as a strategy to change sentence structure?",
            options: [
                "Changing from Active Voice to Passive Voice.",
                "Changing all nouns to pronouns.",
                "Removing all adjectives from the sentence.",
                "Translating the text to another language and back."
            ],
            correct: 0, 
            explanation: "Salah satu strategi mengubah struktur adalah memanipulasi tata bahasa, contohnya mengubah kalimat aktif menjadi kalimat pasif ('Active to Passive Voice'). [Video 10d]"
        },

        // --- C2: MEMAHAMI (20 Poin) ---
        {
            id: 7,
            video: "Video 10b: Concepts",
            category: "C2 - Memahami",
            points: 20,
            text: "Why does the module suggest that a good academic paper should NOT be filled entirely with direct quotes?",
            options: [
                "Because it makes the paper look too messy and difficult to read.",
                "Because relying too heavily on quotes shows a lack of original thought.",
                "Because typing quotation marks takes too much time on the keyboard.",
                "Because quotes often contain spelling errors from the original author."
            ],
            correct: 1, 
            explanation: "Terlalu banyak kutipan langsung menunjukkan 'lack of original thought' (kurangnya pemikiran orisinal). Akademisi ingin melihat pemahaman Anda sendiri. [Video 10b]"
        },
        {
            id: 8,
            video: "Video 10b: Concepts",
            category: "C2 - Memahami",
            points: 20,
            text: "What does successful paraphrasing demonstrate to the reader/instructor about the student?",
            options: [
                "It proves that the student has fully digested and understood the material.",
                "It proves that the student owns a good dictionary or thesaurus.",
                "It proves that the student is capable of typing very quickly.",
                "It proves that the student disagrees with the original author's opinion."
            ],
            correct: 0, 
            explanation: "Parafrasa yang baik membuktikan bahwa mahasiswa telah sepenuhnya mencerna dan memahami materi ('fully digested and understood'). [Video 10b]"
        },
        {
            id: 9,
            video: "Video 10d: Strategies",
            category: "C2 - Memahami",
            points: 20,
            text: "How does altering sentence length function as a paraphrasing strategy?",
            options: [
                "By simply deleting half the words to make the sentence shorter.",
                "By adding unnecessary filler words to make the sentence look longer.",
                "By combining short sentences into a complex one, or breaking a long sentence into clearer ones.",
                "By repeating the same sentence twice to double the length."
            ],
            correct: 2, 
            explanation: "Strateginya adalah mengubah arsitektur kalimat: menggabungkan dua kalimat pendek menjadi satu kompleks, atau memecah satu kalimat panjang menjadi dua yang lebih jelas. [Video 10d]"
        },

        // --- C3: MENERAPKAN (30 Poin) ---
        {
            id: 10,
            video: "Video 10e: Case Study Application",
            category: "C3 - Menerapkan",
            points: 30,
            text: "Original Text: 'Havasu Canyon is in a remote area.' Which of the following is the best paraphrase based on the module's example?",
            options: [
                "Havasu Canyon is located in a place that is far away.",
                "The location of Havasu Canyon is highly isolated.",
                "Havasu Canyon is in a remote region.",
                "It is difficult to find Havasu Canyon because it is remote."
            ],
            correct: 1, 
            explanation: "Modul mencontohkan penggantian 'remote area' dengan 'highly isolated' dan mengubah struktur kalimatnya secara signifikan. Opsi lain masih terlalu mirip kosakata aslinya. [Video 10e]"
        },
        {
            id: 11,
            video: "Video 10c: Application of Rules",
            category: "C3 - Menerapkan",
            points: 30,
            text: "A student takes the sentence 'The cat sat on the mat' and changes it to 'The feline sat on the rug.' Why is this a POOR paraphrase?",
            options: [
                "Because the meaning has changed significantly.",
                "Because the student added their own personal opinion.",
                "Because only the vocabulary changed, but the sentence structure remained identical.",
                "Because the student used words that are too difficult to understand."
            ],
            correct: 2, 
            explanation: "Ini adalah contoh 'word-swapping' yang buruk. Meskipun kosa kata berubah (Cat->Feline), struktur kalimatnya (Subjek-Verba-Objek) masih sama persis dengan aslinya. [Video 10c]"
        },
        {
            id: 12,
            video: "Video 10f: Structural Application",
            category: "C3 - Menerapkan",
            points: 30,
            text: "Original: 'Whatever form of transportation you use will take almost a whole day.' Which option best paraphrases this by shifting the perspective?",
            options: [
                "Any type of transport you choose will use up nearly an entire day.",
                "It will take you about one day to get there regardless of transport.",
                "A journey to this destination consumes nearly an entire day, regardless of the travel method.",
                "You will spend a whole day traveling no matter what transportation form you use."
            ],
            correct: 2, 
            explanation: "Modul menyarankan pergeseran perspektif kalimat sepenuhnya. Opsi C mengubah subjek dari 'You/Transport' menjadi 'A journey', menciptakan struktur arsitektur baru yang segar. [Video 10f]"
        }
    ];

    // Array yang akan menampung soal yang sudah diacak
    let quizData = [];
    const userAnswers = {};
    const totalPossiblePoints = rawQuizData.reduce((sum, q) => sum + q.points, 0);

    // Fungsi Pengacak (Fisher-Yates Shuffle)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        if (!container) return;
        
        container.innerHTML = ''; 
        
        // 1. Acak Soal
        quizData = shuffleArray([...rawQuizData]);

        // 2. Bagi menjadi halaman (3 soal per halaman)
        const questionsPerPage = 3;
        const totalPages = Math.ceil(quizData.length / questionsPerPage);

        for (let i = 0; i < totalPages; i++) {
            const stepDiv = document.createElement('div');
            stepDiv.className = `step ${i === 0 ? 'active' : ''}`;
            stepDiv.id = `step-${i}`;

            const startIdx = i * questionsPerPage;
            const endIdx = Math.min(startIdx + questionsPerPage, quizData.length);
            const pageQuestions = quizData.slice(startIdx, endIdx);

            let html = ``;
            
            pageQuestions.forEach((q, indexOnPage) => {
                // Nomor soal yang tampil tetap urut 1-12
                const displayNum = startIdx + indexOnPage + 1;

                html += `
                <div class="card">
                    <div class="meta-tags">
                        <span class="video-tag">${q.video}</span>
                        <span class="category-tag">${q.category} (${q.points} Poin)</span>
                    </div>
                    <p class="question-text"><strong>${displayNum}.</strong> ${q.text}</p>
                    <div class="options">
                        ${q.options.map((opt, idx) => `
                            <label class="option-label">
                                <input type="radio" name="q${q.id}" value="${idx}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            });

            // Tombol Navigasi
            if (i < totalPages - 1) {
                html += `<button type="button" class="btn" onclick="nextStep(${i})">Next Section</button>`;
            } else {
                html += `<button type="button" class="btn" style="background-color: #4caf50; color: white;" onclick="finishQuiz()">Submit & See Score</button>`;
            }

            stepDiv.innerHTML = html;
            container.appendChild(stepDiv);
        }

        // Halaman Hasil
        const resultDiv = document.createElement('div');
        resultDiv.id = 'result-step';
        resultDiv.className = 'step';
        container.appendChild(resultDiv);
    }

    function nextStep(currentStepIndex) {
        const stepDiv = document.getElementById(`step-${currentStepIndex}`);
        const inputs = stepDiv.querySelectorAll('input[type="radio"]');
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        let allAnswered = true;
        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("Please answer all questions before proceeding.");
            return;
        }

        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        document.getElementById(`step-${currentStepIndex}`).classList.remove('active');
        document.getElementById(`step-${currentStepIndex + 1}`).classList.add('active');
        window.scrollTo(0,0);
    }

    function finishQuiz() {
        const inputs = document.querySelectorAll('.step.active input[type="radio"]');
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        let allAnswered = true;
        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("Please answer all questions before submitting.");
            return;
        }

        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        calculateAndShowResults();
    }

    function calculateAndShowResults() {
        let earnedPoints = 0;
        let correctCount = 0;
        let reviewHTML = '';

        // Tampilkan review sesuai urutan pengerjaan (acak)
        quizData.forEach((q, index) => {
            const userAnswer = userAnswers[q.id];
            const isCorrect = userAnswer === q.correct;
            
            if (isCorrect) {
                earnedPoints += q.points;
                correctCount++;
            }

            const statusClass = isCorrect ? 'correct' : 'wrong';
            const statusIcon = isCorrect ? '✅ BENAR' : '❌ SALAH';
            const pointDisplay = isCorrect ? `(+${q.points} Poin)` : `(0 Poin)`;

            reviewHTML += `
            <div class="review-item ${statusClass}">
                <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 5px;">
                    Soal #${index + 1} | ${q.category} | Nilai: ${q.points}
                </div>
                <div style="font-weight: bold; margin-bottom: 10px; font-size: 1.1rem;">${q.text}</div>
                
                <div style="margin-bottom: 8px; color: ${isCorrect ? '#4caf50' : '#f44336'}; font-weight:bold;">
                    ${statusIcon} ${pointDisplay} <br>
                    <span style="font-weight:normal; color:#ddd;">Jawaban Anda: ${q.options[userAnswer]}</span>
                </div>
                
                ${!isCorrect ? `<div style="color: #4caf50; font-size: 0.95rem; margin-bottom:10px;"><strong>Jawaban Benar:</strong> ${q.options[q.correct]}</div>` : ''}
                
                <div class="review-explanation">
                    <span class="indonesian-flag">🇮🇩 PENJELASAN:</span>
                    <p class="explanation-text">${q.explanation}</p>
                </div>
            </div>`;
        });

        const finalPercentage = Math.round((earnedPoints / totalPossiblePoints) * 100);

        const resultContainer = document.getElementById('result-step');
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        resultContainer.classList.add('active');

        resultContainer.innerHTML = `
            <div class="card result-box">
                <h2>Quiz Completed!</h2>
                <div class="score-circle">
                    <span class="score-number">${finalPercentage}%</span>
                    <span class="score-label">Score</span>
                </div>
                <p style="font-size:1.2rem;">Total Poin: <strong style="color:#4da6ff">${earnedPoints}</strong> / ${totalPossiblePoints}</p>
                <p style="color:#aaa;">Jawaban Benar: ${correctCount} dari ${quizData.length} soal</p>
            </div>

            <button type="button" class="btn btn-nav" onclick="window.location.href='index.html'">⬅ Kembali ke Menu Utama</button>
            <button type="button" class="btn" onclick="location.reload()">🔄 Kerjakan Ulang (Soal Diacak)</button>
            
            <h3 style="margin-top: 40px; border-bottom: 1px solid #444; padding-bottom: 15px;">Review & Explanation (Bahasa Indonesia)</h3>
            ${reviewHTML}
            
            <button type="button" class="btn btn-nav" onclick="window.scrollTo(0,0)" style="margin-top:30px;">⬆ Kembali ke Atas</button>
        `;

        window.scrollTo(0,0);
    }

    document.addEventListener('DOMContentLoaded', initQuiz);

</script>

</body>
</html>
