<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOU Module 5 Simulation</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #4da6ff;
            --correct-color: #4caf50;
            --wrong-color: #f44336;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--accent-color); }
        p.subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px; }

        /* Card Style */
        .card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .video-label {
            display: inline-block;
            background-color: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-label:hover {
            background-color: #2c2c2c;
        }

        .option-label input {
            margin-top: 4px;
            margin-right: 12px;
            accent-color: var(--accent-color);
        }

        /* Buttons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }
        
        /* Tombol Navigasi Khusus */
        .btn-nav {
            background-color: #333; 
            color: #fff; 
            border: 1px solid #555;
            margin-bottom: 10px;
        }

        .btn:hover { opacity: 0.9; }
        .btn:disabled { background-color: #555; cursor: not-allowed; }

        /* Results & Review */
        .result-box {
            text-align: center;
            padding: 30px;
        }
        
        .score-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
            border: 4px solid var(--accent-color);
        }

        .review-item {
            background-color: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid #555;
            text-align: left;
        }

        .review-item.correct { border-left-color: var(--correct-color); }
        .review-item.wrong { border-left-color: var(--wrong-color); }

        .review-explanation {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #444;
            font-size: 0.95rem;
            color: #ccc;
        }
        
        .indonesian-flag {
            font-size: 0.8rem;
            color: #ff9800;
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* Navigation Steps */
        .step { display: none; }
        .step.active { display: block; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>IOU Module 5 Simulation</h1>
        <p class="subtitle">Note-Taking Techniques</p>
    </header>

    <form id="quizForm">
        <div id="quiz-container"></div>
    </form>
</div>

<script>
    // DATA SOAL (Module 5a - 5f)
    const quizData = [
        {
            video: "Video 5a: Introduction & Titles",
            questions: [
                {
                    id: 1,
                    text: "\"Being physically active can improve your brain health, help manage weight...\" The most specific title to make notes for this text would be:",
                    options: [
                        "Physical Activity",
                        "Physical Activity Helps Brain Health",
                        "Benefits of Physical Activity",
                        "None of these"
                    ],
                    correct: 2, // Option C
                    explanation: "Judul 'Benefits of Physical Activity' (Manfaat Aktivitas Fisik) lebih spesifik dan mencakup seluruh isi teks (kesehatan otak, berat badan, dll) dibandingkan judul yang terlalu umum."
                },
                {
                    id: 2,
                    text: "When taking notes, what is the recommended strategy regarding 'filler words'?",
                    options: [
                        "Write down every single word to ensure accuracy.",
                        "Filter them out and use symbols or abbreviations instead.",
                        "Highlight them in a different color.",
                        "Write them in capital letters."
                    ],
                    correct: 1, // Option B
                    explanation: "Strategi mencatat yang efektif adalah menyaring kata-kata pelengkap ('filter out filler words') dan menggunakan simbol/singkatan agar ringkas."
                }
            ]
        },
        {
            video: "Video 5b: Manager Training (IMPM)",
            questions: [
                {
                    id: 3,
                    text: "\"The IMPM runs with five on-site modules of approximately 2 weeks each, spread over 16 months...\". If highlighting the preceding passage, one should highlight:",
                    options: [
                        "Five on-site modules",
                        "2 weeks each",
                        "16 months",
                        "All of the given answers"
                    ],
                    correct: 3, // Option D
                    explanation: "Semua angka dan fakta spesifik (5 modul, 2 minggu, 16 bulan) penting untuk struktur program, jadi 'All of the given answers' harus di-highlight."
                },
                {
                    id: 4,
                    text: "Choose the most important point regarding who companies select for the IMPM program:",
                    options: [
                        "Companies select people",
                        "With strong intellectual abilities as well as proven records of getting things done",
                        "Getting things done",
                        "Proven records"
                    ],
                    correct: 1, // Option B (Logic based on completeness)
                    explanation: "Poin terpenting adalah kriteria lengkapnya: 'strong intellectual abilities' DAN 'proven records'. Opsi lain terlalu umum atau tidak lengkap."
                }
            ]
        },
        {
            video: "Video 5c: Hindu Weddings",
            questions: [
                {
                    id: 5,
                    text: "Choose the most important point and the best way to take notes for the sentence: 'In India, traditional Hindu weddings are usually lavish affairs...'",
                    options: [
                        "In India",
                        "Traditional Hindu",
                        "Lavish affairs",
                        "Many special customs"
                    ],
                    correct: 2, // Option C
                    explanation: "Kata kunci deskriptif utama yang menangkap suasana pernikahan tersebut adalah 'Lavish affairs' (Acara mewah)."
                },
                {
                    id: 6,
                    text: "Select the choice that meets the criteria for good notes regarding the groom's arrival (transportation):",
                    options: [
                        "Groom - white horse",
                        "Groom - white car",
                        "Groom - transportation - white car, horse, elephant",
                        "Groom - white elephant"
                    ],
                    correct: 2, // Option C
                    explanation: "Catatan yang baik harus mencakup semua variasi yang disebutkan teks: 'white car, horse, elephant', bukan hanya salah satunya."
                }
            ]
        },
        {
            video: "Video 5d: Havasu Canyon",
            questions: [
                {
                    id: 7,
                    text: "For a descriptive text like the Havasu Canyon travel guide, what format is often better than bullet points for grouping information?",
                    options: [
                        "A long paragraph",
                        "A numbered list",
                        "A pie chart",
                        "A Venn diagram"
                    ],
                    correct: 1, // Option B
                    explanation: "Untuk teks deskriptif perjalanan, daftar bernomor ('numbered list') seringkali lebih baik untuk mengelompokkan info seperti Lokasi, Akses, dll."
                },
                {
                    id: 8,
                    text: "The phrase 'Villagers stand in doorways... they do not smile' can be condensed in notes as:",
                    options: [
                        "Villagers are standing.",
                        "Villagers: Unsmiling.",
                        "Villagers do not have doors.",
                        "Villagers are happy."
                    ],
                    correct: 1, // Option B
                    explanation: "Meringkas deskripsi panjang menjadi 'Villagers: Unsmiling' adalah cara efektif mencatat esensi tanpa bertele-tele."
                }
            ]
        },
        {
            video: "Video 5e: The Wali (Rulings)",
            questions: [
                {
                    id: 9,
                    text: "If reading an Islamic book, it's important to highlight:",
                    options: [
                        "Terminology",
                        "Ayah",
                        "Hadith",
                        "All of the given answers"
                    ],
                    correct: 3, // Option D
                    explanation: "Sama seperti di modul sebelumnya, elemen kunci teks Islam adalah Terminologi, Ayat, dan Hadis. Semuanya benar."
                },
                {
                    id: 10,
                    text: "In the hierarchy of the Wali, who comes immediately after the father?",
                    options: [
                        "The mother",
                        "The Islamic ruler",
                        "The closest Muslim male relative (e.g., grandfather)",
                        "The woman herself"
                    ],
                    correct: 2, // Option C
                    explanation: "Setelah ayah, perwalian jatuh ke kerabat laki-laki Muslim terdekat (seperti kakek), sebelum beralih ke saudara atau paman."
                }
            ]
        },
        {
            video: "Video 5f: The Wali (Prohibitions)",
            questions: [
                {
                    id: 11,
                    text: "What is a specific bad consequence mentioned for a woman appointing her own Wali (e.g., a friend)?",
                    options: [
                        "It leads to a more expensive wedding.",
                        "It leads to treating him as a close friend, potentially leading to Khalwat (seclusion).",
                        "It makes the marriage contract invalid immediately.",
                        "It causes the family to boycott the wedding."
                    ],
                    correct: 1, // Option B
                    explanation: "Konsekuensi buruk spesifik yang disebutkan adalah memperlakukan wali seperti teman dekat yang bisa mengarah pada 'Khalwat' (berdua-duaan)."
                },
                {
                    id: 12,
                    text: "The situation that would NOT require you to annotate by underlining or highlighting the text is:",
                    options: [
                        "Information that is new",
                        "Information that is confusing",
                        "Information that you already know",
                        "Information that is interesting"
                    ],
                    correct: 2, // Option C
                    explanation: "Anda tidak perlu membuang waktu menyorot informasi yang sudah diketahui ('Information that you already know')."
                }
            ]
        }
    ];

    let currentVideoIndex = 0;
    const userAnswers = {};

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        
        quizData.forEach((section, index) => {
            const stepDiv = document.createElement('div');
            stepDiv.className = `step ${index === 0 ? 'active' : ''}`;
            stepDiv.id = `step-${index}`;

            let html = `<div class="card">
                <span class="video-label">${section.video}</span>`;

            section.questions.forEach(q => {
                html += `
                <div style="margin-top: 20px; border-top: 1px solid #333; padding-top:20px;">
                    <p class="question-text"><strong>${q.id}.</strong> ${q.text}</p>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <label class="option-label">
                                <input type="radio" name="q${q.id}" value="${i}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            });

            html += `</div>`; 

            if (index < quizData.length - 1) {
                html += `<button type="button" class="btn" onclick="nextStep(${index})">Next Video</button>`;
            } else {
                html += `<button type="button" class="btn" style="background-color: #4caf50; color: white;" onclick="finishQuiz()">Submit & See Score</button>`;
            }

            stepDiv.innerHTML = html;
            container.appendChild(stepDiv);
        });

        const resultDiv = document.createElement('div');
        resultDiv.id = 'result-step';
        resultDiv.className = 'step';
        container.appendChild(resultDiv);
    }

    function nextStep(currentIndex) {
        const currentQuestions = quizData[currentIndex].questions;
        let allAnswered = true;

        currentQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (!selected) allAnswered = false;
            else userAnswers[q.id] = parseInt(selected.value);
        });

        if (!allAnswered) {
            alert("Please answer all questions before proceeding.");
            return;
        }

        document.getElementById(`step-${currentIndex}`).classList.remove('active');
        document.getElementById(`step-${currentIndex + 1}`).classList.add('active');
        window.scrollTo(0,0);
    }

    function finishQuiz() {
        const lastIndex = quizData.length - 1;
        const currentQuestions = quizData[lastIndex].questions;
        let allAnswered = true;

        currentQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (!selected) allAnswered = false;
            else userAnswers[q.id] = parseInt(selected.value);
        });

        if (!allAnswered) {
            alert("Please answer all questions before submitting.");
            return;
        }

        calculateAndShowResults();
    }

    function calculateAndShowResults() {
        let score = 0;
        let total = 0;
        let reviewHTML = '';

        quizData.forEach(section => {
            section.questions.forEach(q => {
                total++;
                const userAnswer = userAnswers[q.id];
                const isCorrect = userAnswer === q.correct;
                
                if (isCorrect) score++;

                const statusClass = isCorrect ? 'correct' : 'wrong';
                const statusIcon = isCorrect ? '✅ Benar' : '❌ Salah';
                
                reviewHTML += `
                <div class="review-item ${statusClass}">
                    <div style="font-size: 0.85rem; color: #888; margin-bottom: 5px;">${section.video}</div>
                    <div style="font-weight: bold; margin-bottom: 8px;">${q.id}. ${q.text}</div>
                    <div style="margin-bottom: 5px; color: ${isCorrect ? '#4caf50' : '#f44336'}">
                        ${statusIcon} (You answered: ${q.options[userAnswer]})
                    </div>
                    ${!isCorrect ? `<div style="color: #4caf50; font-size: 0.9rem;">Correct Answer: ${q.options[q.correct]}</div>` : ''}
                    
                    <div class="review-explanation">
                        <span class="indonesian-flag">🇮🇩 PENJELASAN:</span>
                        ${q.explanation}
                    </div>
                </div>`;
            });
        });

        const finalScore = Math.round((score / total) * 100);

        const resultContainer = document.getElementById('result-step');
        
        resultContainer.innerHTML = `
            <div class="card result-box">
                <h2>Quiz Completed!</h2>
                <div class="score-circle">${finalScore}</div>
                <p>You got ${score} out of ${total} correct.</p>
            </div>

            <button type="button" class="btn btn-nav" onclick="window.location.href='index.html'">⬅ Kembali ke Menu Utama</button>
            <button type="button" class="btn" onclick="location.reload()">🔄 Kerjakan Ulang</button>
            
            <h3 style="margin-top: 30px; border-bottom: 1px solid #444; padding-bottom: 10px;">Review & Explanation (Bahasa Indonesia)</h3>
            ${reviewHTML}
            
            <button type="button" class="btn btn-nav" onclick="window.scrollTo(0,0)" style="margin-top:20px;">⬆ Kembali ke Atas</button>
        `;

        document.getElementById(`step-${quizData.length - 1}`).classList.remove('active');
        resultContainer.classList.add('active');
        window.scrollTo(0,0);
    }

    initQuiz();

</script>

</body>
</html>
