<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOU Module 9 Simulation (Weighted)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #4da6ff;
            --correct-color: #4caf50;
            --wrong-color: #f44336;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--accent-color); }
        p.subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px; }

        /* Card Style */
        .card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .meta-tags {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }

        .video-tag {
            background-color: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .category-tag {
            background-color: #2c3e50;
            color: #4da6ff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #4da6ff;
        }

        .question-text {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .option-label:hover {
            background-color: #2c2c2c;
            border-color: var(--accent-color);
        }

        .option-label input {
            margin-top: 5px;
            margin-right: 15px;
            accent-color: var(--accent-color);
            transform: scale(1.2);
        }

        /* Buttons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        
        .btn-nav {
            background-color: #333; 
            color: #fff; 
            border: 1px solid #555;
            margin-bottom: 15px;
        }

        .btn:hover { opacity: 0.9; }

        /* Results & Review */
        .result-box {
            text-align: center;
            padding: 40px;
        }
        
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 5px solid var(--accent-color);
        }

        .score-number { font-size: 2.2rem; font-weight: bold; color: var(--accent-color); }
        .score-label { font-size: 0.8rem; color: #aaa; margin-top: -5px; }

        .review-item {
            background-color: #252525;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 6px solid #555;
            text-align: left;
        }

        .review-item.correct { border-left-color: var(--correct-color); }
        .review-item.wrong { border-left-color: var(--wrong-color); }

        .review-explanation {
            background-color: #333; 
            border: 1px solid #FFD700; 
            padding: 15px; 
            margin-top: 15px; 
            border-radius: 8px;
        }
        
        .indonesian-flag {
            font-size: 0.95rem;
            color: #FFD700; 
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .explanation-text {
            color: #fff;
            margin: 0;
            font-size: 1rem;
            line-height: 1.5;
        }

        .step { display: none; }
        .step.active { display: block; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>IOU Module 9 Simulation</h1>
        <p class="subtitle">Engineering Arguments</p>
    </header>

    <form id="quizForm">
        <div id="quiz-container">
            <p style="text-align:center; color: #666;">Loading questions...</p>
        </div>
    </form>
</div>

<script>
    /* KONFIGURASI BOBOT NILAI:
       C1 (Mengingat) = 10 Poin
       C2 (Memahami)  = 20 Poin
       C3 (Menerapkan)= 30 Poin
    */

    const quizData = [
        // --- C1: MENGINGAT (10 Poin) ---
        {
            id: 1,
            video: "Chapter 1: Claims vs Facts",
            category: "C1 - Mengingat",
            points: 10,
            text: "What is the one absolute requirement for a valid academic 'Claim' as described in the module?",
            options: [
                "It must describe a biological reality that is universally accepted.",
                "It must be debatable and capable of being disputed by others.",
                "It must express a strong emotional reaction to a specific event.",
                "It must be a statement of fact that requires no persuasion."
            ],
            correct: 1, 
            explanation: "Syarat mutlak klaim akademis adalah 'must be debatable' (harus bisa didebat). Jika sebuah pernyataan tidak bisa disanggah (seperti fakta biologis), maka itu bukan argumen."
        },
        {
            id: 2,
            video: "Chapter 1: Claims vs Facts",
            category: "C1 - Mengingat",
            points: 10,
            text: "Which of the following statements is classified as a 'Fact' (not a claim) in the module examples?",
            options: [
                "Smoking is considered Haram in Islamic Law.",
                "Social media has a negative impact on society.",
                "Men cannot biologically give birth to children.",
                "Single parents cannot raise successful children."
            ],
            correct: 2, 
            explanation: "'Men cannot give birth' (Pria tidak bisa melahirkan) adalah realitas biologis. Ini adalah fakta, bukan klaim, karena tidak ada ruang untuk perdebatan atau persuasi."
        },
        {
            id: 3,
            video: "Chapter 2: Argument Fuel",
            category: "C1 - Mengingat",
            points: 10,
            text: "Using stories about 'My Uncle Steve' to prove a point is considered what type of evidence?",
            options: [
                "Systemic Evidence based on population data.",
                "Anecdotal Evidence (Weak) based on anomalies.",
                "Verifiable Corporate Data from reports.",
                "Strong Evidence derived from peer reviews."
            ],
            correct: 1, 
            explanation: "Cerita pribadi seperti 'Paman Steve' disebut 'Anecdotal Evidence'. Ini dianggap bukti lemah (weak) karena ukuran sampelnya hanya satu dan seringkali merupakan anomali statistik."
        },
        {
            id: 4,
            video: "Chapter 2: Argument Fuel",
            category: "C1 - Mengingat",
            points: 10,
            text: "Why does the module explicitly label Wikipedia as 'Weak Evidence' for academic arguments?",
            options: [
                "Because it requires a paid subscription to access the full data.",
                "Because it is unstable and can be edited by anyone at any time.",
                "Because the articles are too long and difficult to read.",
                "Because it focuses only on historical events and not current issues."
            ],
            correct: 1, 
            explanation: "Wikipedia dikategorikan sebagai bukti lemah karena sifatnya yang 'unstable' (tidak stabil). Artikelnya bisa diedit oleh siapa saja (dari pakar hingga remaja iseng), sehingga kurang akuntabilitas."
        },
        {
            id: 5,
            video: "Chapter 4: Case Studies",
            category: "C1 - Mengingat",
            points: 10,
            text: "What is the specific concept used to describe women having both a corporate role and a domestic role?",
            options: [
                "The Glass Ceiling Effect.",
                "The Argument Checklist.",
                "The Dual Burden.",
                "The Editorial Veto."
            ],
            correct: 2, 
            explanation: "Konsep wanita yang bekerja di kantor (peran korporat) lalu pulang mengerjakan tugas rumah tangga (peran domestik) disebut 'The Dual Burden' (Beban Ganda)."
        },
        {
            id: 6,
            video: "Chapter 2: Strong Evidence",
            category: "C1 - Mengingat",
            points: 10,
            text: "In the example of 'Strong Evidence', which institution was cited for offering 6 months of paid maternity leave?",
            options: [
                "The World Bank Group.",
                "Banco do Brasil.",
                "Google Corporation.",
                "The United Nations."
            ],
            correct: 1, 
            explanation: "Contoh bukti kuat yang sistemik adalah data kebijakan dari 'Banco do Brasil' yang tercatat memberikan cuti melahirkan berbayar selama 6 bulan."
        },

        // --- C2: MEMAHAMI (20 Poin) ---
        {
            id: 7,
            video: "Chapter 1: Understanding Concepts",
            category: "C2 - Memahami",
            points: 20,
            text: "Why is the statement 'Smoking is Haram' considered a Claim rather than a Fact in the context of this module?",
            options: [
                "Because it is explicitly written as a fact in the Quran without interpretation.",
                "Because it is not universally agreed upon (some view it as Makruh) and requires a logic bridge.",
                "Because medical science has not yet proven that smoking causes harm to the body.",
                "Because it is a biological reality that cannot be disputed by any scholar."
            ],
            correct: 1, 
            explanation: "Ini adalah klaim karena tidak ada kesepakatan universal (ada pandangan yang menganggapnya Makruh). Anda perlu membangun 'jembatan logika' (menyakiti diri = dilarang) untuk membuktikannya."
        },
        {
            id: 8,
            video: "Chapter 3: Counter Arguments",
            category: "C2 - Memahami",
            points: 20,
            text: "According to the module, what is the strategic effect of acknowledging a valid opposing point (Counter Argument)?",
            options: [
                "It makes you look weak and unsure of your own position.",
                "It confuses the reader by presenting too many conflicting ideas.",
                "It makes you look reasonable, authoritative, and unbiased.",
                "It destroys your own argument by admitting the other side is right."
            ],
            correct: 2, 
            explanation: "Mengakui poin valid dari lawan justru membuat Anda terlihat masuk akal ('reasonable') dan berwibawa ('authoritative'). Mengabaikannya malah membuat Anda terlihat bias atau bodoh."
        },
        {
            id: 9,
            video: "Chapter 4: Case Study Analysis",
            category: "C2 - Memahami",
            points: 20,
            text: "In the 'Single Parents' case study, why did the author's argument collapse even though his initial claim was valid?",
            options: [
                "Because he relied too heavily on systemic data and boring statistics.",
                "Because his argument was based on ego, emotional language, and personal anecdotes.",
                "Because he did not have a strong opinion on the subject matter.",
                "Because the topic of single parenting is not debatable in academia."
            ],
            correct: 1, 
            explanation: "Meskipun klaimnya valid, argumennya runtuh karena eksekusinya buruk: ia menggunakan bahasa emosional ('mengerikan') dan anekdot pribadi (kakeknya), bukan data objektif."
        },

        // --- C3: MENERAPKAN (30 Poin) ---
        {
            id: 10,
            video: "Application: Creating Claims",
            category: "C3 - Menerapkan",
            points: 30,
            text: "You are writing an academic paper. Which of the following sentences would successfully satisfy the requirement of making a 'Debatable Claim'?",
            options: [
                "Water consistently boils at 100 degrees Celsius at sea level.",
                "Implementing school uniforms significantly improves student discipline.",
                "The sun rises in the East and sets in the West.",
                "Humans require oxygen and water to survive."
            ],
            correct: 1, 
            explanation: "Opsi A, C, dan D adalah fakta alam/ilmiah yang tidak bisa didebat. Opsi B ('Seragam meningkatkan disiplin') adalah klaim yang bisa diperdebatkan (ada yang setuju, ada yang tidak), sehingga valid sebagai argumen."
        },
        {
            id: 11,
            video: "Application: Selecting Evidence",
            category: "C3 - Menerapkan",
            points: 30,
            text: "If you want to provide 'Strong Evidence' for an argument about workplace equality, which source should you choose to include?",
            options: [
                "A personal success story about your aunt who became a manager.",
                "A Wikipedia article about equality that was edited yesterday.",
                "Systemic data and recorded corporate policies from a major financial institution.",
                "A passionate blog post written by an anonymous teenager."
            ],
            correct: 2, 
            explanation: "Bukti kuat haruslah 'systemic and verifiable' (sistemik dan dapat diverifikasi). Data kebijakan perusahaan besar adalah pilihan terbaik dibandingkan cerita bibi (anekdot) atau Wikipedia."
        },
        {
            id: 12,
            video: "Application: Pro-Con Strategy",
            category: "C3 - Menerapkan",
            points: 30,
            text: "Applying the 'Pro-Con Table Technique' to an argument about Social Media, what is the most effective way to structure your argument?",
            options: [
                "Ignore all benefits completely and only list the negative aspects.",
                "State clearly that 'Social media is evil' and provide no further context.",
                "Admit the benefits first (lifeline for seniors), then dismantle them by explaining the net negative effect.",
                "List the pros and cons in a random bulleted list without any analysis."
            ],
            correct: 2, 
            explanation: "Teknik terbaik adalah 'Invite the Opposition': mengakui manfaatnya terlebih dahulu (misal: koneksi untuk lansia), baru kemudian menyerang sisi negatifnya (depresi) agar argumen lebih mematikan dan seimbang."
        }
    ];

    let currentVideoIndex = 0;
    const userAnswers = {};

    // Total possible points calculation
    const totalPossiblePoints = quizData.reduce((sum, q) => sum + q.points, 0);

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        if (!container) return;
        
        container.innerHTML = ''; 
        
        // Randomize questions slightly or keep order? Let's keep order for structured complexity
        // But we need to group them into "slides" or just show one by one?
        // Let's stick to the previous format: Group by "Video/Topic" logic if needed, 
        // but since we have mixed categories, let's group by 3 questions per page to make it digestible.
        
        const questionsPerPage = 3;
        const totalPages = Math.ceil(quizData.length / questionsPerPage);

        for (let i = 0; i < totalPages; i++) {
            const stepDiv = document.createElement('div');
            stepDiv.className = `step ${i === 0 ? 'active' : ''}`;
            stepDiv.id = `step-${i}`;

            const startIdx = i * questionsPerPage;
            const endIdx = Math.min(startIdx + questionsPerPage, quizData.length);
            const pageQuestions = quizData.slice(startIdx, endIdx);

            let html = ``;
            
            pageQuestions.forEach(q => {
                html += `
                <div class="card">
                    <div class="meta-tags">
                        <span class="video-tag">${q.video}</span>
                        <span class="category-tag">${q.category} (${q.points} Poin)</span>
                    </div>
                    <p class="question-text"><strong>${q.id}.</strong> ${q.text}</p>
                    <div class="options">
                        ${q.options.map((opt, idx) => `
                            <label class="option-label">
                                <input type="radio" name="q${q.id}" value="${idx}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            });

            // Navigation Buttons
            if (i < totalPages - 1) {
                html += `<button type="button" class="btn" onclick="nextStep(${i})">Next Section</button>`;
            } else {
                html += `<button type="button" class="btn" style="background-color: #4caf50; color: white;" onclick="finishQuiz()">Submit & See Score</button>`;
            }

            stepDiv.innerHTML = html;
            container.appendChild(stepDiv);
        }

        // Add Result Step
        const resultDiv = document.createElement('div');
        resultDiv.id = 'result-step';
        resultDiv.className = 'step';
        container.appendChild(resultDiv);
    }

    function nextStep(currentStepIndex) {
        // Validate answers for current page
        const stepDiv = document.getElementById(`step-${currentStepIndex}`);
        const inputs = stepDiv.querySelectorAll('input[type="radio"]');
        
        // Get unique question names on this page
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        let allAnswered = true;
        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("Please answer all questions before proceeding.");
            return;
        }

        // Save answers
        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        // Change Slide
        document.getElementById(`step-${currentStepIndex}`).classList.remove('active');
        document.getElementById(`step-${currentStepIndex + 1}`).classList.add('active');
        window.scrollTo(0,0);
    }

    function finishQuiz() {
        // Validate last page
        const inputs = document.querySelectorAll('.step.active input[type="radio"]');
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        let allAnswered = true;
        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("Please answer all questions before submitting.");
            return;
        }

        // Save last answers
        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        calculateAndShowResults();
    }

    function calculateAndShowResults() {
        let earnedPoints = 0;
        let correctCount = 0;
        let reviewHTML = '';

        quizData.forEach(q => {
            const userAnswer = userAnswers[q.id];
            const isCorrect = userAnswer === q.correct;
            
            if (isCorrect) {
                earnedPoints += q.points;
                correctCount++;
            }

            const statusClass = isCorrect ? 'correct' : 'wrong';
            const statusIcon = isCorrect ? '✅ BENAR' : '❌ SALAH';
            const pointDisplay = isCorrect ? `(+${q.points} Poin)` : `(0 Poin)`;

            reviewHTML += `
            <div class="review-item ${statusClass}">
                <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 5px;">
                    ${q.video} | ${q.category} | Nilai Soal: ${q.points}
                </div>
                <div style="font-weight: bold; margin-bottom: 10px; font-size: 1.1rem;">${q.id}. ${q.text}</div>
                
                <div style="margin-bottom: 8px; color: ${isCorrect ? '#4caf50' : '#f44336'}; font-weight:bold;">
                    ${statusIcon} ${pointDisplay} <br>
                    <span style="font-weight:normal; color:#ddd;">Jawaban Anda: ${q.options[userAnswer]}</span>
                </div>
                
                ${!isCorrect ? `<div style="color: #4caf50; font-size: 0.95rem; margin-bottom:10px;"><strong>Jawaban Benar:</strong> ${q.options[q.correct]}</div>` : ''}
                
                <div class="review-explanation">
                    <span class="indonesian-flag">🇮🇩 PENJELASAN:</span>
                    <p class="explanation-text">${q.explanation}</p>
                </div>
            </div>`;
        });

        // Calculate Percentage
        const finalPercentage = Math.round((earnedPoints / totalPossiblePoints) * 100);

        const resultContainer = document.getElementById('result-step');
        
        // Hide all question steps
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        resultContainer.classList.add('active');

        resultContainer.innerHTML = `
            <div class="card result-box">
                <h2>Quiz Completed!</h2>
                <div class="score-circle">
                    <span class="score-number">${finalPercentage}%</span>
                    <span class="score-label">Score</span>
                </div>
                <p style="font-size:1.2rem;">Total Poin: <strong style="color:#4da6ff">${earnedPoints}</strong> / ${totalPossiblePoints}</p>
                <p style="color:#aaa;">Jawaban Benar: ${correctCount} dari ${quizData.length} soal</p>
            </div>

            <button type="button" class="btn btn-nav" onclick="window.location.href='index.html'">⬅ Kembali ke Menu Utama</button>
            <button type="button" class="btn" onclick="location.reload()">🔄 Kerjakan Ulang</button>
            
            <h3 style="margin-top: 40px; border-bottom: 1px solid #444; padding-bottom: 15px;">Review & Explanation (Bahasa Indonesia)</h3>
            ${reviewHTML}
            
            <button type="button" class="btn btn-nav" onclick="window.scrollTo(0,0)" style="margin-top:30px;">⬆ Kembali ke Atas</button>
        `;

        window.scrollTo(0,0);
    }

    document.addEventListener('DOMContentLoaded', initQuiz);

</script>

</body>
</html>
