<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOU Module 9 Simulation</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #4da6ff;
            --correct-color: #4caf50;
            --wrong-color: #f44336;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--accent-color); }
        p.subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px; }

        /* Card Style */
        .card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .video-label {
            display: inline-block;
            background-color: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .category-label {
            display: block;
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 5px;
            font-style: italic;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-label:hover {
            background-color: #2c2c2c;
        }

        .option-label input {
            margin-top: 4px;
            margin-right: 12px;
            accent-color: var(--accent-color);
        }

        /* Buttons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }
        
        .btn-nav {
            background-color: #333; 
            color: #fff; 
            border: 1px solid #555;
            margin-bottom: 10px;
        }

        .btn:hover { opacity: 0.9; }
        .btn:disabled { background-color: #555; cursor: not-allowed; }

        /* Results & Review */
        .result-box {
            text-align: center;
            padding: 30px;
        }
        
        .score-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
            border: 4px solid var(--accent-color);
        }

        .review-item {
            background-color: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid #555;
            text-align: left;
        }

        .review-item.correct { border-left-color: var(--correct-color); }
        .review-item.wrong { border-left-color: var(--wrong-color); }

        .review-explanation {
            background-color: #333; 
            border: 1px solid #FFD700; 
            padding: 10px; 
            margin-top: 10px; 
            border-radius: 8px;
        }
        
        .indonesian-flag {
            font-size: 0.9rem;
            color: #FFD700; 
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .explanation-text {
            color: #fff;
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .step { display: none; }
        .step.active { display: block; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>IOU Module 9 Simulation</h1>
        <p class="subtitle">Engineering Arguments</p>
    </header>

    <form id="quizForm">
        <div id="quiz-container">
            <p style="text-align:center; color: #666;">Loading questions...</p>
        </div>
    </form>
</div>

<script>
    // DATA SOAL MODULE 9
    // Komposisi: 6 C1 (Mengingat), 3 C2 (Memahami), 3 C3 (Menerapkan)
    
    const quizData = [
        // --- LEVEL C1: MENGINGAT (6 Soal) ---
        {
            video: "Chapter 1: Claims vs Facts",
            category: "C1 - Mengingat",
            questions: [
                {
                    id: 1,
                    text: "What is the one absolute requirement for a valid academic 'Claim'?",
                    options: [
                        "It must be a biological reality.",
                        "It must be debatable (can be disputed).",
                        "It must be agreed upon by everyone.",
                        "It must be emotional."
                    ],
                    correct: 1, 
                    explanation: "Syarat mutlak klaim akademis adalah 'must be debatable' (harus bisa didebat). Jika tidak bisa disanggah, itu adalah fakta, bukan argumen. [Cite: Module 9, Page 1]"
                },
                {
                    id: 2,
                    text: "Which of the following is given as an example of a 'Fact' (not a claim) in the module?",
                    options: [
                        "Smoking is Haram.",
                        "Social media is evil.",
                        "Men cannot give birth.",
                        "Single parents are bad."
                    ],
                    correct: 2, 
                    explanation: "'Men cannot give birth' (Pria tidak bisa melahirkan) adalah realitas biologis dan fakta, bukan klaim yang perlu diperdebatkan. [Cite: Module 9, Page 1]"
                }
            ]
        },
        {
            video: "Chapter 2: Argument Fuel",
            category: "C1 - Mengingat",
            questions: [
                {
                    id: 3,
                    text: "Using stories about 'My Uncle Steve' to prove a point is considered what type of evidence?",
                    options: [
                        "Systemic Evidence",
                        "Anecdotal Evidence (Weak)",
                        "Verifiable Data",
                        "Corporate Policy"
                    ],
                    correct: 1, 
                    explanation: "Cerita pribadi seperti 'Paman Steve' disebut 'Anecdotal Evidence'. Secara statistik ini dianggap sampah (weak/lemah) karena ukuran sampelnya hanya satu. [Cite: Module 9, Page 2]"
                },
                {
                    id: 4,
                    text: "Why does the module label Wikipedia as 'Weak Evidence'?",
                    options: [
                        "Because it is too expensive.",
                        "Because it is unstable and can be edited by anyone.",
                        "Because it has too much information.",
                        "Because it is only for teenagers."
                    ],
                    correct: 1, 
                    explanation: "Wikipedia tidak stabil ('unstable') karena bisa diedit oleh siapa saja, dari pakar hingga remaja iseng, sehingga kurang akuntabilitas. [Cite: Module 9, Page 2]"
                }
            ]
        },
        {
            video: "Chapter 4: Case Studies",
            category: "C1 - Mengingat",
            questions: [
                {
                    id: 5,
                    text: "What is the concept introduced in the article about women in the workplace having both a corporate role and a domestic role?",
                    options: [
                        "The Glass Ceiling",
                        "The Argument Checklist",
                        "The Dual Burden",
                        "The Editorial Veto"
                    ],
                    correct: 2, 
                    explanation: "Konsep wanita memiliki beban ganda (pekerjaan kantor dan pekerjaan rumah tangga) disebut 'The Dual Burden'. [Cite: Module 9, Page 4]"
                },
                {
                    id: 6,
                    text: "In the 'Strong Evidence' example, which institution was cited for offering 6 months of paid maternity leave?",
                    options: [
                        "World Bank",
                        "Banco do Brasil",
                        "Google",
                        "The United Nations"
                    ],
                    correct: 1, 
                    explanation: "Contoh bukti kuat (sistemik) adalah data dari 'Banco do Brasil' yang memberikan cuti melahirkan 6 bulan. [Cite: Module 9, Page 3]"
                }
            ]
        },

        // --- LEVEL C2: MEMAHAMI (3 Soal) ---
        {
            video: "Chapter 1 & 3: Understanding Concepts",
            category: "C2 - Memahami",
            questions: [
                {
                    id: 7,
                    text: "Why is the statement 'Smoking is Haram' considered a Claim rather than a Fact in this module?",
                    options: [
                        "Because it is written in the Quran explicitly.",
                        "Because it is not universally agreed upon (some view it as Makruh) and requires a logic bridge.",
                        "Because smoking is healthy.",
                        "Because it is a biological reality."
                    ],
                    correct: 1, 
                    explanation: "Ini adalah klaim karena tidak disepakati secara universal (ada yang menganggap makruh). Kita perlu membangun jembatan logika (menyakiti diri = haram) untuk membuktikannya. [Cite: Module 9, Page 2]"
                },
                {
                    id: 8,
                    text: "According to the module, what is the effect of acknowledging a valid opposing point (Counter Argument)?",
                    options: [
                        "It makes you look weak and unsure.",
                        "It confuses the reader.",
                        "It makes you look reasonable and authoritative.",
                        "It destroys your own argument immediately."
                    ],
                    correct: 2, 
                    explanation: "Mengakui poin lawan membuat Anda terlihat masuk akal ('reasonable') dan berwibawa ('authoritative'), bukan bias. [Cite: Module 9, Page 3]"
                },
                {
                    id: 9,
                    text: "In the 'Single Parents' case study, why did the author's argument collapse despite having a valid claim?",
                    options: [
                        "Because he used too much data.",
                        "Because his argument was based on ego, emotion ('horrifying'), and personal anecdotes instead of data.",
                        "Because he didn't have an opinion.",
                        "Because the claim was not debatable."
                    ],
                    correct: 1, 
                    explanation: "Argumennya runtuh karena eksekusinya buruk: menggunakan bahasa emosional ('mengerikan') dan anekdot pribadi, bukan data objektif. [Cite: Module 9, Page 4]"
                }
            ]
        },

        // --- LEVEL C3: MENERAPKAN (3 Soal) ---
        {
            video: "Application & Strategy",
            category: "C3 - Menerapkan",
            questions: [
                {
                    id: 10,
                    text: "You are writing a paper. Which of the following sentences would satisfy the requirement of making a 'Debatable Claim'?",
                    options: [
                        "Water boils at 100 degrees Celsius.",
                        "School uniforms significantly improve student discipline.",
                        "The sun rises in the East.",
                        "Humans need oxygen to survive."
                    ],
                    correct: 1, 
                    explanation: "Opsi A, C, dan D adalah fakta ilmiah/alam yang tidak bisa didebat. Opsi B ('Seragam meningkatkan disiplin') adalah klaim yang bisa diperdebatkan setuju/tidaknya. [Cite: Module 9, Page 1]"
                },
                {
                    id: 11,
                    text: "If you want to provide 'Strong Evidence' for an argument about workplace equality, which source should you choose?",
                    options: [
                        "A story about your aunt who became a manager.",
                        "A Wikipedia article that was edited yesterday.",
                        "Systemic data and recorded corporate policies from a major institution.",
                        "A blog post written by an anonymous teenager."
                    ],
                    correct: 2, 
                    explanation: "Bukti kuat haruslah 'systemic and verifiable' (sistemik dan dapat diverifikasi), seperti data kebijakan perusahaan, bukan cerita bibi atau Wikipedia. [Cite: Module 9, Page 3]"
                },
                {
                    id: 12,
                    text: "Applying the 'Pro-Con Table Technique' to an argument about Social Media, what is the best way to structure your argument?",
                    options: [
                        "Ignore all benefits and only list the bad things.",
                        "Say 'Social media is evil' and stop there.",
                        "Admit the benefits first (lifeline for seniors), then dismantle them by explaining the net negative effect (depression).",
                        "List the pros and cons in a random list without analysis."
                    ],
                    correct: 2, 
                    explanation: "Teknik terbaik adalah mengakui manfaatnya terlebih dahulu (Undang oposisi), baru kemudian menyerang sisi negatifnya agar argumen lebih mematikan. [Cite: Module 9, Page 3]"
                }
            ]
        }
    ];

    let currentVideoIndex = 0;
    const userAnswers = {};

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        if (!container) return;
        
        container.innerHTML = ''; 
        
        quizData.forEach((section, index) => {
            const stepDiv = document.createElement('div');
            stepDiv.className = `step ${index === 0 ? 'active' : ''}`;
            stepDiv.id = `step-${index}`;

            let html = `<div class="card">
                <span class="video-label">${section.video}</span>`;

            section.questions.forEach(q => {
                html += `
                <div style="margin-top: 20px; border-top: 1px solid #333; padding-top:20px;">
                    <span class="category-label">[${q.category}]</span>
                    <p class="question-text"><strong>${q.id}.</strong> ${q.text}</p>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <label class="option-label">
                                <input type="radio" name="q${q.id}" value="${i}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            });

            html += `</div>`; 

            if (index < quizData.length - 1) {
                html += `<button type="button" class="btn" onclick="nextStep(${index})">Next Section</button>`;
            } else {
                html += `<button type="button" class="btn" style="background-color: #4caf50; color: white;" onclick="finishQuiz()">Submit & See Score</button>`;
            }

            stepDiv.innerHTML = html;
            container.appendChild(stepDiv);
        });

        const resultDiv = document.createElement('div');
        resultDiv.id = 'result-step';
        resultDiv.className = 'step';
        container.appendChild(resultDiv);
    }

    function nextStep(currentIndex) {
        const currentQuestions = quizData[currentIndex].questions;
        let allAnswered = true;

        currentQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (!selected) allAnswered = false;
            else userAnswers[q.id] = parseInt(selected.value);
        });

        if (!allAnswered) {
            alert("Please answer all questions before proceeding.");
            return;
        }

        document.getElementById(`step-${currentIndex}`).classList.remove('active');
        document.getElementById(`step-${currentIndex + 1}`).classList.add('active');
        window.scrollTo(0,0);
    }

    function finishQuiz() {
        const lastIndex = quizData.length - 1;
        const currentQuestions = quizData[lastIndex].questions;
        let allAnswered = true;

        currentQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (!selected) allAnswered = false;
            else userAnswers[q.id] = parseInt(selected.value);
        });

        if (!allAnswered) {
            alert("Please answer all questions before submitting.");
            return;
        }

        calculateAndShowResults();
    }

    function calculateAndShowResults() {
        let score = 0;
        let total = 0;
        let reviewHTML = '';

        quizData.forEach(section => {
            section.questions.forEach(q => {
                total++;
                const userAnswer = userAnswers[q.id];
                const isCorrect = userAnswer === q.correct;
                
                if (isCorrect) score++;

                const statusClass = isCorrect ? 'correct' : 'wrong';
                const statusIcon = isCorrect ? '✅ Benar' : '❌ Salah';
                
                reviewHTML += `
                <div class="review-item ${statusClass}">
                    <div style="font-size: 0.85rem; color: #888; margin-bottom: 5px;">${section.video} | <span style="color:#aaa;">${q.category}</span></div>
                    <div style="font-weight: bold; margin-bottom: 8px;">${q.id}. ${q.text}</div>
                    <div style="margin-bottom: 5px; color: ${isCorrect ? '#4caf50' : '#f44336'}">
                        ${statusIcon} (You answered: ${q.options[userAnswer]})
                    </div>
                    ${!isCorrect ? `<div style="color: #4caf50; font-size: 0.9rem;">Correct Answer: ${q.options[q.correct]}</div>` : ''}
                    
                    <div class="review-explanation">
                        <span class="indonesian-flag">🇮🇩 PENJELASAN BAHASA INDONESIA:</span>
                        <p class="explanation-text">${q.explanation}</p>
                    </div>
                </div>`;
            });
        });

        const finalScore = Math.round((score / total) * 100);

        const resultContainer = document.getElementById('result-step');
        
        resultContainer.innerHTML = `
            <div class="card result-box">
                <h2>Quiz Completed!</h2>
                <div class="score-circle">${finalScore}</div>
                <p>You got ${score} out of ${total} correct.</p>
            </div>

            <button type="button" class="btn btn-nav" onclick="window.location.href='index.html'">⬅ Kembali ke Menu Utama</button>
            <button type="button" class="btn" onclick="location.reload()">🔄 Kerjakan Ulang</button>
            
            <h3 style="margin-top: 30px; border-bottom: 1px solid #444; padding-bottom: 10px;">Review & Explanation (Bahasa Indonesia)</h3>
            ${reviewHTML}
            
            <button type="button" class="btn btn-nav" onclick="window.scrollTo(0,0)" style="margin-top:20px;">⬆ Kembali ke Atas</button>
        `;

        document.getElementById(`step-${quizData.length - 1}`).classList.remove('active');
        resultContainer.classList.add('active');
        window.scrollTo(0,0);
    }

    document.addEventListener('DOMContentLoaded', initQuiz);

</script>

</body>
</html>
