<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOU Module 17 Simulation (Randomized)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #4da6ff;
            --correct-color: #4caf50;
            --wrong-color: #f44336;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--accent-color); }
        p.subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px; }

        /* Card Style */
        .card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .meta-tags {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }

        .video-tag {
            background-color: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .category-tag {
            background-color: #2c3e50;
            color: #4da6ff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #4da6ff;
        }

        .question-text {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .option-label:hover {
            background-color: #2c2c2c;
            border-color: var(--accent-color);
        }

        .option-label input {
            margin-top: 5px;
            margin-right: 15px;
            accent-color: var(--accent-color);
            transform: scale(1.2);
        }

        /* Buttons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        
        .btn-nav {
            background-color: #333; 
            color: #fff; 
            border: 1px solid #555;
            margin-bottom: 15px;
        }

        .btn:hover { opacity: 0.9; }
        
        /* Dashboard Button Highlight */
        .btn-dashboard {
            background-color: #ff9800;
            color: #fff;
        }
        .btn-dashboard:hover {
            background-color: #e68a00;
        }

        /* Results & Review */
        .result-box {
            text-align: center;
            padding: 40px;
        }
        
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 5px solid var(--accent-color);
        }

        .score-number { font-size: 2.2rem; font-weight: bold; color: var(--accent-color); }
        .score-label { font-size: 0.8rem; color: #aaa; margin-top: -5px; }

        .review-item {
            background-color: #252525;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 6px solid #555;
            text-align: left;
        }

        .review-item.correct { border-left-color: var(--correct-color); }
        .review-item.wrong { border-left-color: var(--wrong-color); }

        .review-explanation {
            background-color: #333; 
            border: 1px solid #FFD700; 
            padding: 15px; 
            margin-top: 15px; 
            border-radius: 8px;
        }
        
        .indonesian-flag {
            font-size: 0.95rem;
            color: #FFD700; 
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .explanation-text {
            color: #fff;
            margin: 0;
            font-size: 1rem;
            line-height: 1.5;
        }

        .step { display: none; }
        .step.active { display: block; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>IOU Module 17 Simulation</h1>
        <p class="subtitle">Editing, Proofreading & Mechanics</p>
    </header>

    <form id="quizForm">
        <div id="quiz-container">
            <p style="text-align:center; color: #666;">Memuat soal...</p>
        </div>
    </form>
</div>

<script>
    const rawQuizData = [
        {
            id: 1,
            video: "Video 17b",
            category: "C2 - Memahami (20 Poin)",
            points: 20,
            text: "Why is the grammatical structure in the sentence 'Do not expect quick results when you start to learning a language' incorrect?",
            options: [
                "The word 'expect' should be written in the past tense to correctly match the context of the sentence.",
                "The preposition 'to' cannot be directly followed by an '-ing' progressive verb form.",
                "The phrase 'quick results' strictly requires a definite article before it to be accurate.",
                "The sentence completely lacks a clear subject and verb agreement in its main clause."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\n\n\nPenjelasan video secara eksplisit menyebutkan bahwa kata 'to' (sebagai infinitif) tidak boleh diikuti oleh bentuk verb-ING (progresif). Seharusnya 'start to learn' atau 'start learning' tanpa 'to'."
        },
        {
            id: 2,
            video: "Video 17a",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "According to the editing process rules, which of the following elements is NOT the primary focus during the editing stage?",
            options: [
                "Grammar and punctuation accuracy.",
                "Spelling and writing mechanics.",
                "Content and main ideas.",
                "Sentence structure and capitalization."
            ],
            correct: 2, 
            explanation: "Jawaban Benar: C\n\n[Image comparing the revising vs editing stages in the writing process]\n\nKonten (isi) dan gagasan utama (main ideas) tidak lagi difokuskan pada tahap pengeditan, karena masalah konten sudah diselesaikan pada tahap sebelumnya yaitu revisi. Editing murni berfokus pada mekanika penulisan (ejaan, grammar, kapitalisasi)."
        },
        {
            id: 3,
            video: "Video 17e",
            category: "C3 - Menerapkan (30 Poin)",
            points: 30,
            text: "Apply the rules of possessive apostrophes and introductory phrase punctuation to correctly edit the following sentence: 'With her parents support she could accomplish her mission.' (Assuming the text refers to both a mother and a father).",
            options: [
                "With her parents support, she could accomplish her mission.",
                "With her parent's support, she could accomplish her mission.",
                "With her parents' support she could accomplish her mission.",
                "With her parents' support, she could accomplish her mission."
            ],
            correct: 3, 
            explanation: "Jawaban Benar: D\n\n[Image explaining plural possessive apostrophe placement for 'parents']\n\nPenempatan apostrophe setelah 's' (parents') benar untuk menunjukkan kepemilikan jamak (dari kedua orang tua). Selain itu, frasa pengantar independen ('With her parents' support') wajib dipisahkan dengan koma sebelum masuk ke klausa utama."
        },
        {
            id: 4,
            video: "Video 17c",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "How should a compound adjective like 'education related' be properly formatted when placed before a noun in an academic article?",
            options: [
                "Education related-topics",
                "Education-related topics",
                "Education related topics",
                "Education, related topics"
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\n[Image showing how to hyphenate compound adjectives before a noun]\n\nBerdasarkan aturan tata bahasa, jika dua kata digabung untuk memodifikasi sebuah kata benda secara bersamaan (compound adjective), harus disisipkan tanda hubung di antara kedua kata tersebut (education-related)."
        },
        {
            id: 5,
            video: "Video 17b",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "Identify the unnecessary word that must be removed from the following sentence to make it grammatically correct: 'Where is Samuel? He is working at outside 10 minutes ago.'",
            options: [
                "Where",
                "Is",
                "At",
                "Ago"
            ],
            correct: 2, 
            explanation: "Jawaban Benar: C\n\nKata 'outside' merupakan kata keterangan (adverb) tempat. Di dalam aturan bahasa Inggris dasar, kita tidak meletakkan preposisi 'at' sebelum kata keterangan 'outside'."
        },
        {
            id: 6,
            video: "Video 17d",
            category: "C3 - Menerapkan (30 Poin)",
            points: 30,
            text: "Evaluate the grammatical error in the following sentence: 'These values has consistently guided their seventh child.' Which of the following options correctly explains the error and provides the proper edit?",
            options: [
                "'Values' acts as a singular collective noun; therefore, the verb should remain 'has' but 'consistently' must be removed.",
                "'Values' is plural (equivalent to 'they'), so the verb must agree by changing 'has' to 'have'.",
                "'Child' is the main subject, so the sentence should be rewritten as 'Their seventh child have consistently guided these values.'",
                "The verb tense is entirely incorrect for a past event; 'has' should be changed to 'had' to match the timeline."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\n[Image illustrating subject-verb agreement for plural nouns like 'values' with 'have']\n\nKata 'values' bersifat jamak (setara dengan kata ganti 'they'). Oleh karena itu, hukum subject-verb agreement mengharuskan kata kerja tunggal 'has' diubah menjadi jamak yaitu 'have'."
        },
        {
            id: 7,
            video: "Video 17d",
            category: "C2 - Memahami (20 Poin)",
            points: 20,
            text: "Based on the editing rules for capitalization, why should the word 'mathematics' NOT be capitalized in the phrase 'graduated with a degree in mathematics,' but 'English' would be capitalized?",
            options: [
                "Academic subjects are never capitalized unless they are placed as the first word in a sentence.",
                "Capital letters are exclusively used for academic subjects that are names of specific languages.",
                "Mathematics is considered a general field, while English is a highly specific and advanced concentration.",
                "The capitalization rules depend entirely on the specific university's naming conventions for their degrees."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\n[Image highlighting capitalization rules for academic subjects vs specific languages]\n\nSesuai penjelasan di video, huruf kapital untuk subjek akademik secara umum tidak digunakan (seperti mathematics, history, science), kecuali jika mata pelajaran tersebut merujuk pada nama bahasa kebangsaan (seperti English, Spanish, Arabic)."
        },
        {
            id: 8,
            video: "Video 17a",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "If you are peer editing a friend's paper and notice a letter that should be capitalized but is currently written in lowercase, what is the correct correction mark to use without changing their text directly?",
            options: [
                "Draw a bold circle around the lowercase letter.",
                "Write the correct capital letter directly above the lowercase letter.",
                "Draw exactly three lines under the letter that needs capitalization.",
                "Put a visible question mark right next to the incorrect word."
            ],
            correct: 2, 
            explanation: "Jawaban Benar: C\n\n\n\nJika menemukan huruf yang seharusnya ditulis kapital, tanda koreksi standar editor adalah menggambar 3 garis bawah di bawah huruf tersebut agar penulis aslinya memperbaikinya sendiri."
        },
        {
            id: 9,
            video: "Video 17f",
            category: "C2 - Memahami (20 Poin)",
            points: 20,
            text: "In dialogue editing, how should you correctly punctuate a direct question spoken by a character, such as Melissa asking about global warming?",
            options: [
                "'What is global warming'? asked Melissa.",
                "'What is global warming,' asked Melissa?",
                "'What is global warming?' asked Melissa.",
                "'What is global warming' asked Melissa."
            ],
            correct: 2, 
            explanation: "Jawaban Benar: C\n\n\n\nTanda tanya ditempatkan di dalam (sebelum) tanda kutip penutup untuk menandakan bahwa kutipan dialog tersebut merupakan sebuah pertanyaan langsung. Kemudian baru diikuti oleh frasa pengiring tanpa tanda kutip tambahan."
        },
        {
            id: 10,
            video: "Video 17e",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "What is the correct way to write a specific decade, such as the nineteen-sixties, according to the editing guidelines provided in the module?",
            options: [
                "1960's",
                "1960s'",
                "1960s",
                "'1960s"
            ],
            correct: 2, 
            explanation: "Jawaban Benar: C\n\nBerdasarkan aturan pengeditan yang dikoreksi di video, dekade ditulis dalam angka diikuti dengan huruf 's' tanpa perlu penambahan tanda apostrof di manapun (yaitu '1960s')."
        },
        {
            id: 11,
            video: "Video 17c",
            category: "C3 - Menerapkan (30 Poin)",
            points: 30,
            text: "Analyze the following excerpt: 'Find an online platform to host your series With SoundCloud, you can embed your podcast into social media posts easily.' What is the most appropriate and grammatically sound way to edit this text?",
            options: [
                "Add a comma immediately after 'series' and keep 'With' capitalized.",
                "Add a period immediately after 'series' and keep 'With' capitalized.",
                "Add a semicolon immediately after 'series' and change 'With' to lowercase.",
                "Remove the word 'With' completely and combine the two sentences using a conjunction."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\n[Image illustrating how to fix a run-on sentence using a period and capital letter]\n\nParagraf tersebut mengalami kesalahan penulisan 'run-on sentence' karena dua kalimat utuh menempel. Cara memperbaikinya paling tepat adalah dengan meletakkan titik (.) setelah 'series' dan memulai kalimat baru."
        },
        {
            id: 12,
            video: "Video 17d",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "When writing a location that includes both a specific city and a state, such as Oxford and North Carolina, what punctuation mark must always be placed directly between them?",
            options: [
                "A semicolon",
                "A colon",
                "A period",
                "A comma"
            ],
            correct: 3, 
            explanation: "Jawaban Benar: D\n\nSangat ditekankan dalam materi pengeditan lokasi geografis bahwa di antara nama kota dan nama negara bagian (seperti Atlanta, Georgia atau Oxford, North Carolina) harus selalu disisipkan tanda baca koma."
        }
    ];

    let quizData = [];
    const userAnswers = {};
    const totalPossiblePoints = rawQuizData.reduce((sum, q) => sum + q.points, 0);

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        if (!container) return;
        
        container.innerHTML = ''; 
        quizData = shuffleArray([...rawQuizData]);

        const questionsPerPage = 3;
        const totalPages = Math.ceil(quizData.length / questionsPerPage);

        for (let i = 0; i < totalPages; i++) {
            const stepDiv = document.createElement('div');
            stepDiv.className = `step ${i === 0 ? 'active' : ''}`;
            stepDiv.id = `step-${i}`;

            const startIdx = i * questionsPerPage;
            const endIdx = Math.min(startIdx + questionsPerPage, quizData.length);
            const pageQuestions = quizData.slice(startIdx, endIdx);

            let html = ``;
            
            pageQuestions.forEach((q, indexOnPage) => {
                const displayNum = startIdx + indexOnPage + 1;

                html += `
                <div class="card">
                    <div class="meta-tags">
                        <span class="video-tag">${q.video}</span>
                        <span class="category-tag">${q.category}</span>
                    </div>
                    <p class="question-text"><strong>${displayNum}.</strong> ${q.text}</p>
                    <div class="options">
                        ${q.options.map((opt, idx) => `
                            <label class="option-label">
                                <input type="radio" name="q${q.id}" value="${idx}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            });

            if (i < totalPages - 1) {
                html += `<button type="button" class="btn" onclick="nextStep(${i})">Lanjut ke Halaman Berikutnya</button>`;
            } else {
                html += `<button type="button" class="btn" style="background-color: #4caf50; color: white;" onclick="finishQuiz()">Kirim & Lihat Nilai Akhir</button>`;
            }

            stepDiv.innerHTML = html;
            container.appendChild(stepDiv);
        }

        const resultDiv = document.createElement('div');
        resultDiv.id = 'result-step';
        resultDiv.className = 'step';
        container.appendChild(resultDiv);
    }

    function nextStep(currentStepIndex) {
        const stepDiv = document.getElementById(`step-${currentStepIndex}`);
        const inputs = stepDiv.querySelectorAll('input[type="radio"]');
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        let allAnswered = true;
        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("Harap jawab semua soal di halaman ini sebelum melanjutkan.");
            return;
        }

        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        document.getElementById(`step-${currentStepIndex}`).classList.remove('active');
        document.getElementById(`step-${currentStepIndex + 1}`).classList.add('active');
        window.scrollTo(0,0);
    }

    function finishQuiz() {
        const inputs = document.querySelectorAll('.step.active input[type="radio"]');
        let allAnswered = true;
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("Harap jawab semua soal sebelum mengirimkan jawaban.");
            return;
        }

        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        calculateAndShowResults();
    }

    function calculateAndShowResults() {
        let earnedPoints = 0;
        let correctCount = 0;
        let reviewHTML = '';

        quizData.forEach((q, index) => {
            const userAnswer = userAnswers[q.id];
            const isCorrect = userAnswer === q.correct;
            
            if (isCorrect) {
                earnedPoints += q.points;
                correctCount++;
            }

            const statusClass = isCorrect ? 'correct' : 'wrong';
            const statusIcon = isCorrect ? '✅ BENAR' : '❌ SALAH';
            const pointDisplay = isCorrect ? `(+${q.points} Poin)` : `(0 Poin)`;

            reviewHTML += `
            <div class="review-item ${statusClass}">
                <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 5px;">
                    Soal #${index + 1} | ${q.category}
                </div>
                <div style="font-weight: bold; margin-bottom: 10px; font-size: 1.15rem;">${q.text}</div>
                
                <div style="margin-bottom: 8px; color: ${isCorrect ? '#4caf50' : '#f44336'}; font-weight:bold;">
                    ${statusIcon} ${pointDisplay} <br>
                    <span style="font-weight:normal; color:#ddd;">Jawaban Anda: ${q.options[userAnswer]}</span>
                </div>
                
                ${!isCorrect ? `<div style="color: #4caf50; font-size: 1rem; margin-bottom:10px;"><strong>Jawaban Benar:</strong> ${q.options[q.correct]}</div>` : ''}
                
                <div class="review-explanation">
                    <span class="indonesian-flag">🇮🇩 PENJELASAN:</span>
                    <p class="explanation-text" style="white-space: pre-wrap;">${q.explanation}</p>
                </div>
            </div>`;
        });

        const finalPercentage = Math.round((earnedPoints / totalPossiblePoints) * 100);

        const resultContainer = document.getElementById('result-step');
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        resultContainer.classList.add('active');

        // Added the explicit "Back to Dashboard / Menu Utama" button here
        resultContainer.innerHTML = `
            <div class="card result-box">
                <h2>Kuis Selesai!</h2>
                <div class="score-circle">
                    <span class="score-number">${finalPercentage}%</span>
                    <span class="score-label">Skor Akhir</span>
                </div>
                <p style="font-size:1.2rem;">Total Poin: <strong style="color:#4da6ff">${earnedPoints}</strong> / ${totalPossiblePoints}</p>
                <p style="color:#aaa;">Jawaban Benar: ${correctCount} dari ${quizData.length} soal</p>
                
                <div style="margin-top: 25px; display: flex; gap: 10px; flex-direction: column;">
                    <button type="button" class="btn" onclick="location.reload()">🔄 Kerjakan Ulang Kuis</button>
                    <button type="button" class="btn btn-dashboard" onclick="window.location.href='index.html'">🏠 Kembali ke Menu Utama (Dashboard)</button>
                </div>
            </div>
            
            <h3 style="margin-top: 40px; border-bottom: 1px solid #444; padding-bottom: 15px; text-align: left;">Ulasan & Penjelasan</h3>
            ${reviewHTML}
            
            <button type="button" class="btn btn-nav" onclick="window.scrollTo(0,0)" style="margin-top:30px;">⬆ Kembali ke Atas</button>
        `;

        window.scrollTo(0,0);
    }

    document.addEventListener('DOMContentLoaded', initQuiz);

</script>

</body>
</html>
