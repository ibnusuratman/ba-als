<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOU Module 6 Simulation</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #4da6ff;
            --correct-color: #4caf50;
            --wrong-color: #f44336;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--accent-color); }
        p.subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px; }

        /* Card Style */
        .card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .video-label {
            display: inline-block;
            background-color: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-label:hover {
            background-color: #2c2c2c;
        }

        .option-label input {
            margin-top: 4px;
            margin-right: 12px;
            accent-color: var(--accent-color);
        }

        /* Buttons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }
        
        /* Tombol Navigasi Khusus */
        .btn-nav {
            background-color: #333; 
            color: #fff; 
            border: 1px solid #555;
            margin-bottom: 10px;
        }

        .btn:hover { opacity: 0.9; }
        .btn:disabled { background-color: #555; cursor: not-allowed; }

        /* Results & Review */
        .result-box {
            text-align: center;
            padding: 30px;
        }
        
        .score-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
            border: 4px solid var(--accent-color);
        }

        .review-item {
            background-color: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid #555;
            text-align: left;
        }

        .review-item.correct { border-left-color: var(--correct-color); }
        .review-item.wrong { border-left-color: var(--wrong-color); }

        .review-explanation {
            /* Desain Kotak Penjelasan KUNING TERANG */
            background-color: #333; 
            border: 1px solid #FFD700; /* Garis Emas */
            padding: 10px; 
            margin-top: 10px; 
            border-radius: 8px;
        }
        
        .indonesian-flag {
            font-size: 0.9rem;
            color: #FFD700; /* Teks Emas */
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .explanation-text {
            color: #fff;
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* Navigation Steps */
        .step { display: none; }
        .step.active { display: block; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>IOU Module 6 Simulation</h1>
        <p class="subtitle">Note-Taking Practice</p>
    </header>

    <form id="quizForm">
        <div id="quiz-container"></div>
    </form>
</div>

<script>
    // DATA SOAL (Module 6a - 6f: Note-Taking Practice)
    const quizData = [
        {
            video: "Video 6a: River Rafting Intro",
            questions: [
                {
                    id: 1,
                    text: "\"River rafting is a challenging sport with important requirements. Therefore, the river rafting company you choose should have a good safety record.\" Choose the most important point and the best way to take notes for this sentence:",
                    options: [
                        "Important requirements",
                        "Challenging sport",
                        "Company - good safety record",
                        "All of the given answers"
                    ],
                    correct: 3, 
                    explanation: "Untuk mendapatkan gambaran lengkap, kita harus mencatat ketiga elemen: sifat olahraga (Challenging), persyaratan (Important requirements), dan keamanan perusahaan (Good safety record). Jadi 'All of the given answers' benar."
                },
                {
                    id: 2,
                    text: "According to the text, what happens as you go up from Level 1 to higher levels in river rafting?",
                    options: [
                        "The water becomes calmer.",
                        "There is an increase in powerful waves and dangerous rocks.",
                        "You need fewer people in the boat.",
                        "The scenery becomes less interesting."
                    ],
                    correct: 1, 
                    explanation: "Teks menyatakan bahwa di setiap kenaikan level, ada peningkatan jumlah gelombang kuat ('powerful waves') dan bebatuan berbahaya ('dangerous rocks')."
                }
            ]
        },
        {
            video: "Video 6b: Drafting Notes (Levels)",
            questions: [
                {
                    id: 3,
                    text: "When taking notes for a range of numbers like \"Level 1 to Level 6\", what is the recommended strategy?",
                    options: [
                        "Write out the full words 'Level one to Level six'.",
                        "Use a dash to represent the range (e.g., Levels 1-6).",
                        "List every single number: 1, 2, 3, 4, 5, 6.",
                        "Only write the highest number."
                    ],
                    correct: 1, 
                    explanation: "Strategi efektif untuk rentang angka adalah menggunakan tanda hubung (dash), contohnya 'Levels 1-6', agar ringkas."
                },
                {
                    id: 4,
                    text: "To create a clear contrast in your notes between Level 1 and higher levels, you should use descriptive keywords like:",
                    options: [
                        "\"Fun\" vs \"Boring\"",
                        "\"No exp\" vs \"Dangerous rocks\"",
                        "\"Water\" vs \"Stone\"",
                        "\"Slow\" vs \"Fast\""
                    ],
                    correct: 1, 
                    explanation: "Gunakan kata kunci deskriptif yang kontras: 'No exp' (Tanpa pengalaman) untuk level rendah dan 'Dangerous rocks' (Batu berbahaya) untuk level tinggi."
                }
            ]
        },
        {
            video: "Video 6c: Equipment & Safety",
            questions: [
                {
                    id: 5,
                    text: "\"In addition, river rafting requires special equipment. You ride an inflatable rubber boat with an expertly trained guide and a group of six to eight people.\" Choose the most important point to note:",
                    options: [
                        "Inflatable rubber boat",
                        "Trained guide",
                        "Group - 6-8 people",
                        "All of the given answers"
                    ],
                    correct: 3, 
                    explanation: "Dalam mencatat perlengkapan/tim, menghilangkan satu item bisa fatal. Jadi semua poin (Perahu, Pemandu, Kelompok) harus dicatat ('All of the given answers')."
                },
                {
                    id: 6,
                    text: "\"Everyone must wear a life jacket and a helmet and be able to use a paddle at the more difficult levels.\" What should be included in your notes?",
                    options: [
                        "Life jacket",
                        "Helmet",
                        "Paddle",
                        "All of the given answers"
                    ],
                    correct: 3, 
                    explanation: "Sama seperti sebelumnya, semua peralatan keselamatan wajib (Life jacket, Helmet, Paddle) harus dicatat agar lengkap."
                }
            ]
        },
        {
            video: "Video 6d: Mountain Climbing Intro",
            questions: [
                {
                    id: 7,
                    text: "Choose the **least effective** way to take notes for the following sentence: \"Mountain climbing is a very dangerous sport with special requirements and strict climbing rules.\"",
                    options: [
                        "Mountain climbing is very dangerous.",
                        "Strict climbing rules.",
                        "Special requirements.",
                        "Dangerous sport + Strict rules."
                    ],
                    correct: 0, 
                    explanation: "Menulis hanya 'Mountain climbing is very dangerous' adalah cara PALING TIDAK EFEKTIF karena terlalu umum (vague) dan mengabaikan 'Mengapa' (karena aturan ketat) serta 'Bagaimana' (persyaratan khusus)."
                },
                {
                    id: 8,
                    text: "What is mentioned as the 'first requirement' for mountain climbing?",
                    options: [
                        "Buying expensive gear.",
                        "Completing a course at a certified climbing school.",
                        "Finding a partner.",
                        "Being physically fit."
                    ],
                    correct: 1, 
                    explanation: "Persyaratan pertama yang disebut dalam teks adalah menyelesaikan kursus di sekolah pendakian bersertifikat ('certified climbing school')."
                }
            ]
        },
        {
            video: "Video 6e: Climbing Rules & Clothing",
            questions: [
                {
                    id: 9,
                    text: "To make notes easier to memorize, how should you group items like 'Helmet' and 'Climbing boots'?",
                    options: [
                        "List them randomly.",
                        "Group them under a main category like 'Special Clothing'.",
                        "Write them in separate sentences.",
                        "Do not write them at all."
                    ],
                    correct: 1, 
                    explanation: "Strategi yang baik adalah pengelompokan (Grouping). Helm dan Sepatu Bot harus dikelompokkan di bawah kategori 'Special Clothing' atau 'Requirement 2'."
                },
                {
                    id: 10,
                    text: "According to the climbing rules mentioned, if climbing in a team, you must be:",
                    options: [
                        "Talking to each other constantly.",
                        "Tied to your partner's waist.",
                        "Wearing matching clothes.",
                        "Carrying each other's bags."
                    ],
                    correct: 1, 
                    explanation: "Aturan untuk tim (2 orang atau lebih) adalah harus terikat ke pinggang rekan ('Tied to partner's waist') demi keselamatan."
                }
            ]
        },
        {
            video: "Video 6f: Animals in Captivity",
            questions: [
                {
                    id: 11,
                    text: "When a text structure contrasts two opposing sides (like Advantages vs Disadvantages of Zoos), what is the most effective visual layout for notes?",
                    options: [
                        "A long linear list.",
                        "A detailed paragraph.",
                        "Split the page into two distinct columns (Pros and Cons).",
                        "Use only drawings."
                    ],
                    correct: 2, 
                    explanation: "Untuk teks Pro vs Kontra, strategi visual terbaik adalah membagi halaman menjadi dua kolom terpisah ('Split page into two distinct columns') agar mudah dibandingkan."
                },
                {
                    id: 12,
                    text: "Which of the following is listed as a 'Disadvantage' of animals living in captivity?",
                    options: [
                        "Protected from predators.",
                        "Fed regularly.",
                        "Regular medical checkups.",
                        "Visitors endanger lives (e.g., throwing wrong food)."
                    ],
                    correct: 3, 
                    explanation: "Opsi A, B, dan C adalah keuntungan. Kerugiannya (Disadvantage) adalah pengunjung yang membahayakan nyawa hewan, misalnya melempar makanan yang salah."
                }
            ]
        }
    ];

    let currentVideoIndex = 0;
    const userAnswers = {};

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        
        quizData.forEach((section, index) => {
            const stepDiv = document.createElement('div');
            stepDiv.className = `step ${index === 0 ? 'active' : ''}`;
            stepDiv.id = `step-${index}`;

            let html = `<div class="card">
                <span class="video-label">${section.video}</span>`;

            section.questions.forEach(q => {
                html += `
                <div style="margin-top: 20px; border-top: 1px solid #333; padding-top:20px;">
                    <p class="question-text"><strong>${q.id}.</strong> ${q.text}</p>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <label class="option-label">
                                <input type="radio" name="q${q.id}" value="${i}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            });

            html += `</div>`; 

            if (index < quizData.length - 1) {
                html += `<button type="button" class="btn" onclick="nextStep(${index})">Next Video</button>`;
            } else {
                html += `<button type="button" class="btn" style="background-color: #4caf50; color: white;" onclick="finishQuiz()">Submit & See Score</button>`;
            }

            stepDiv.innerHTML = html;
            container.appendChild(stepDiv);
        });

        const resultDiv = document.createElement('div');
        resultDiv.id = 'result-step';
        resultDiv.className = 'step';
        container.appendChild(resultDiv);
    }

    function nextStep(currentIndex) {
        const currentQuestions = quizData[currentIndex].questions;
        let allAnswered = true;

        currentQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (!selected) allAnswered = false;
            else userAnswers[q.id] = parseInt(selected.value);
        });

        if (!allAnswered) {
            alert("Please answer all questions before proceeding.");
            return;
        }

        document.getElementById(`step-${currentIndex}`).classList.remove('active');
        document.getElementById(`step-${currentIndex + 1}`).classList.add('active');
        window.scrollTo(0,0);
    }

    function finishQuiz() {
        const lastIndex = quizData.length - 1;
        const currentQuestions = quizData[lastIndex].questions;
        let allAnswered = true;

        currentQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (!selected) allAnswered = false;
            else userAnswers[q.id] = parseInt(selected.value);
        });

        if (!allAnswered) {
            alert("Please answer all questions before submitting.");
            return;
        }

        calculateAndShowResults();
    }

    function calculateAndShowResults() {
        let score = 0;
        let total = 0;
        let reviewHTML = '';

        quizData.forEach(section => {
            section.questions.forEach(q => {
                total++;
                const userAnswer = userAnswers[q.id];
                const isCorrect = userAnswer === q.correct;
                
                if (isCorrect) score++;

                const statusClass = isCorrect ? 'correct' : 'wrong';
                const statusIcon = isCorrect ? '✅ Benar' : '❌ Salah';
                
                reviewHTML += `
                <div class="review-item ${statusClass}">
                    <div style="font-size: 0.85rem; color: #888; margin-bottom: 5px;">${section.video}</div>
                    <div style="font-weight: bold; margin-bottom: 8px;">${q.id}. ${q.text}</div>
                    <div style="margin-bottom: 5px; color: ${isCorrect ? '#4caf50' : '#f44336'}">
                        ${statusIcon} (You answered: ${q.options[userAnswer]})
                    </div>
                    ${!isCorrect ? `<div style="color: #4caf50; font-size: 0.9rem;">Correct Answer: ${q.options[q.correct]}</div>` : ''}
                    
                    <div class="review-explanation">
                        <span class="indonesian-flag">🇮🇩 PENJELASAN BAHASA INDONESIA:</span>
                        <p class="explanation-text">${q.explanation}</p>
                    </div>
                </div>`;
            });
        });

        const finalScore = Math.round((score / total) * 100);

        const resultContainer = document.getElementById('result-step');
        
        resultContainer.innerHTML = `
            <div class="card result-box">
                <h2>Quiz Completed!</h2>
                <div class="score-circle">${finalScore}</div>
                <p>You got ${score} out of ${total} correct.</p>
            </div>

            <button type="button" class="btn btn-nav" onclick="window.location.href='index.html'">⬅ Kembali ke Menu Utama</button>
            <button type="button" class="btn" onclick="location.reload()">🔄 Kerjakan Ulang</button>
            
            <h3 style="margin-top: 30px; border-bottom: 1px solid #444; padding-bottom: 10px;">Review & Explanation (Bahasa Indonesia)</h3>
            ${reviewHTML}
            
            <button type="button" class="btn btn-nav" onclick="window.scrollTo(0,0)" style="margin-top:20px;">⬆ Kembali ke Atas</button>
        `;

        document.getElementById(`step-${quizData.length - 1}`).classList.remove('active');
        resultContainer.classList.add('active');
        window.scrollTo(0,0);
    }

    initQuiz();

</script>

</body>
</html>
