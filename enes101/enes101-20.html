<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOU Module 20 Simulation (Randomized & Visualized)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #4da6ff;
            --correct-color: #4caf50;
            --wrong-color: #f44336;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--accent-color); }
        p.subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px; }

        /* Card Style */
        .card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .meta-tags {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }

        .video-tag {
            background-color: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .category-tag {
            background-color: #2c3e50;
            color: #4da6ff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #4da6ff;
        }

        .question-text {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .option-label:hover {
            background-color: #2c2c2c;
            border-color: var(--accent-color);
        }

        .option-label input {
            margin-top: 5px;
            margin-right: 15px;
            accent-color: var(--accent-color);
            transform: scale(1.2);
        }

        /* Buttons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        
        .btn-nav {
            background-color: #333; 
            color: #fff; 
            border: 1px solid #555;
            margin-bottom: 15px;
        }

        .btn:hover { opacity: 0.9; }

        /* Dashboard Button Highlight */
        .btn-dashboard {
            background-color: #ff9800;
            color: #fff;
        }
        .btn-dashboard:hover {
            background-color: #e68a00;
        }

        /* Results & Review */
        .result-box {
            text-align: center;
            padding: 40px;
        }
        
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 5px solid var(--accent-color);
        }

        .score-number { font-size: 2.2rem; font-weight: bold; color: var(--accent-color); }
        .score-label { font-size: 0.8rem; color: #aaa; margin-top: -5px; }

        .review-item {
            background-color: #252525;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 6px solid #555;
            text-align: left;
        }

        .review-item.correct { border-left-color: var(--correct-color); }
        .review-item.wrong { border-left-color: var(--wrong-color); }

        .review-explanation {
            background-color: #333; 
            border: 1px solid #FFD700; 
            padding: 15px; 
            margin-top: 15px; 
            border-radius: 8px;
        }
        
        .indonesian-flag {
            font-size: 0.95rem;
            color: #FFD700; 
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .explanation-text {
            color: #fff;
            margin: 0;
            font-size: 1rem;
            line-height: 1.5;
        }

        .step { display: none; }
        .step.active { display: block; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>IOU Module 20 Simulation</h1>
        <p class="subtitle">Subject-Verb Agreement</p>
    </header>

    <form id="quizForm">
        <div id="quiz-container">
            <p style="text-align:center; color: #666;">Memuat soal...</p>
        </div>
    </form>
</div>

<script>
    const rawQuizData = [
        {
            id: 1,
            video: "Video 20c",
            category: "C3 - Menerapkan (30 Poin)",
            points: 30,
            text: "Evaluate the following situations and choose the sentence that correctly applies the 'neither...nor' agreement rule.",
            options: [
                "Neither the serving bowl nor the plates goes on that shelf.",
                "Neither the plates nor the serving bowl go on that shelf.",
                "Neither the serving bowl nor the plates go on that shelf.",
                "Neither the plates nor the serving bowls goes on that shelf."
            ],
            correct: 2, 
            explanation: "Jawaban Benar: C\n\n\n\nSesuai aturan dari Video 20c, pada konjungsi berpasangan 'neither...nor', kata kerja harus mengikuti subjek yang letaknya paling dekat dengannya. Di sini subjek terdekat adalah 'plates' (jamak), sehingga penggunaan kata kerja 'go' adalah tepat."
        },
        {
            id: 2,
            video: "Video 20a",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "Which of the following words end in an 's' but are treated as singular subjects in a sentence?",
            options: [
                "Pants and scissors",
                "Tweezers and glasses",
                "Brothers and sisters",
                "Mathematics and news"
            ],
            correct: 3, 
            explanation: "Jawaban Benar: D\n\nBerdasarkan Video 20a, kata-kata tertentu seperti 'mathematics', 'civics', dan 'news' memang memiliki akhiran 's' secara ejaan, tetapi selalu diperlakukan sebagai subjek tunggal (singular) secara gramatikal."
        },
        {
            id: 3,
            video: "Video 20b",
            category: "C2 - Memahami (20 Poin)",
            points: 20,
            text: "Why does the sentence 'Some of the money was missing' use the singular verb 'was' while 'Some of the students were missing' uses the plural verb 'were'?",
            options: [
                "The word 'some' is an exception that is always singular when placed at the beginning of any sentence.",
                "The verb agrees with the noun inside the prepositional phrase when words like 'some' or 'all' are used.",
                "Prepositional phrases must always be entirely ignored to find the true subject in every grammar situation.",
                "The word 'money' is a plural collective noun that requires a singular verb when paired with prepositions."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\n[Image showing subject-verb agreement exceptions for indefinite pronouns like some, all, most]\n\nMenurut Video 20b, kata-kata penunjuk porsi seperti 'some', 'all', 'most' adalah pengecualian. Kita harus melihat kata benda di dalam frasa preposisi (setelah kata 'of') untuk menentukan apakah ia tunggal (seperti 'money') atau jamak (seperti 'students')."
        },
        {
            id: 4,
            video: "Video 20b",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "According to the lesson, which of the following best defines a preposition?",
            options: [
                "A word that describes exactly what the subject is doing in a sentence.",
                "A word that connects two completely independent clauses together.",
                "A word that shows position, such as under, above, on, in, to, and by.",
                "A word that takes the place of a noun, such as he, she, they, or it."
            ],
            correct: 2, 
            explanation: "Jawaban Benar: C\n\nBerdasarkan Video 20b, preposition (kata depan) didefinisikan sebagai kata yang menunjukkan posisi atau hubungan lokasi/waktu, contohnya: under, above, on, in, to, dan by."
        },
        {
            id: 5,
            video: "Video 20f",
            category: "C3 - Menerapkan (30 Poin)",
            points: 30,
            text: "Identify the grammatically correct rewrite for the following incorrect sentence: 'The truck were parked at a convenience store with its rear doors open and its engine running while a delivery man carried doughnuts inside.'",
            options: [
                "The truck was parked at a convenience store with its rear doors open and its engine running while a delivery man carry doughnuts inside.",
                "The trucks was parked at a convenience store with its rear doors open and its engine running while a delivery man carried doughnuts inside.",
                "The truck were parking at a convenience store with its rear doors open and its engine running while a delivery man carries doughnuts inside.",
                "The truck was parked at a convenience store with its rear doors open and its engine running while a delivery man carried doughnuts inside."
            ],
            correct: 3, 
            explanation: "Jawaban Benar: D\n\nBerdasarkan latihan paragraf di Video 20f, 'The truck' adalah subjek tunggal yang membutuhkan kata kerja tunggal masa lampau 'was'. Bagian kalimat lainnya juga harus konsisten menggunakan past tense ('carried')."
        },
        {
            id: 6,
            video: "Video 20e",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "Which rule applies to measurements such as distances, periods of time, and sums of money?",
            options: [
                "They always take a plural verb because they represent more than one unit.",
                "They take a singular verb when they are considered as a single unit.",
                "They must agree with the closest subject when joined by the word 'or'.",
                "They are considered collective nouns and can take either verb form."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\n[Image illustrating singular verb usage for measurements of money, time, and distance]\n\nBerdasarkan Video 20e, jarak, periode waktu, dan jumlah uang (misal: 'Three miles', 'ten dollars') diperlakukan sebagai satu kesatuan ide sehingga selalu membutuhkan kata kerja tunggal."
        },
        {
            id: 7,
            video: "Video 20e",
            category: "C2 - Memahami (20 Poin)",
            points: 20,
            text: "Why is the sentence 'The staff is deciding how they want to vote' considered grammatically inconsistent?",
            options: [
                "'Staff' is an uncountable noun and therefore must not be paired with the verb 'deciding'.",
                "It mixes a singular verb 'is' with a plural pronoun 'they' when referring to the same collective noun.",
                "Collective nouns like 'staff' must always be followed strictly by a plural verb in written language.",
                "The word 'they' refers to a prepositional phrase that has been incorrectly deleted from the sentence."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\nMenurut Video 20e, collective nouns (kata benda kolektif) harus diperlakukan secara konsisten. Kalimat ini salah karena awalnya menggunakan kata kerja tunggal 'is' tetapi kemudian beralih menggunakan kata ganti jamak 'they'. Harus dipilih salah satu (misal: 'The staff members are deciding how they...')."
        },
        {
            id: 8,
            video: "Video 20d",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "In sentences beginning with the words 'here' or 'there,' where is the true subject located?",
            options: [
                "The true subject always comes before the verb.",
                "The true subject is hidden within a prepositional phrase.",
                "The true subject always follows the verb.",
                "The word 'here' or 'there' acts as the true subject."
            ],
            correct: 2, 
            explanation: "Jawaban Benar: C\n\n\n\nBerdasarkan Video 20d (Aturan 6), kalimat yang dimulai dengan 'here' atau 'there' membalik posisi normalnya; subjek sebenarnya selalu berada SETELAH (mengikuti) kata kerja."
        },
        {
            id: 9,
            video: "Video 20d",
            category: "C3 - Menerapkan (30 Poin)",
            points: 30,
            text: "Which of the following sentences correctly applies the subject-verb agreement rule when a subject is separated by a phrase?",
            options: [
                "The politician, along with the newsmen, are expected shortly.",
                "Excitement, as well as nervousness, is the cause of her shaking.",
                "The politician, along with the newsmen, expect shortly.",
                "Excitement, as well as nervousness, are the cause of her shaking."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\nMenurut Video 20d, frasa 'as well as nervousness' bukan bagian dari subjek utama dan harus diabaikan saat menentukan kata kerja. Subjek aslinya adalah 'Excitement' (tunggal), sehingga penggunaan kata kerja tunggal 'is' adalah 100% benar."
        },
        {
            id: 10,
            video: "Video 20c",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "When the words 'either' and 'neither' act alone as pronouns (not paired with 'or' or 'nor'), what form of the verb do they take?",
            options: [
                "They always take a singular verb.",
                "They always take a plural verb.",
                "They take a verb based on the noun inside the phrase.",
                "They take a plural verb only if referring to people."
            ],
            correct: 0, 
            explanation: "Jawaban Benar: A\n\nBerdasarkan aturan di Video 20c, 'either' dan 'neither' adalah penyamar ahli. Jika mereka berdiri sendiri sebagai kata ganti (pronoun) tanpa pasangannya, maknanya selalu tunggal dan membutuhkan kata kerja tunggal."
        },
        {
            id: 11,
            video: "Video 20e",
            category: "C2 - Memahami (20 Poin)",
            points: 20,
            text: "How does the sentence 'If Joe were here, you'd be staring' justify the use of the plural verb 'were' for the singular subject 'Joe'?",
            options: [
                "The verb 'were' is used because Joe is part of a collective noun in this context.",
                "The sentence contains a prepositional phrase that secretly makes the subject plural.",
                "The verb 'were' is used to express a hypothetical situation or a wish contrary to fact.",
                "The word 'were' is acting as an exception because 'Joe' is joined by a conjunction."
            ],
            correct: 2, 
            explanation: "Jawaban Benar: C\n\n\n\nMenurut aturan 10 di Video 20e, kata 'were' menggantikan 'was' pada subjek tunggal ketika kalimat tersebut mengekspresikan pengandaian (subjunctive mood), harapan, atau situasi hipotetis yang bertentangan dengan kenyataan saat ini."
        },
        {
            id: 12,
            video: "Video 20a",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "Based on the introduction to sentence structure, what is the definition of a subject in a sentence?",
            options: [
                "It tells what the subject is or what the subject does or has done.",
                "It is a group of words that begins with a preposition and ends with a noun.",
                "It is who or what the sentence is mainly about.",
                "It is a word that connects multiple clauses to form a cohesive idea."
            ],
            correct: 2, 
            explanation: "Jawaban Benar: C\n\nBerdasarkan Video 20a, subjek didefinisikan sebagai 'siapa atau tentang apa kalimat itu' (who or what the sentence is mainly about)."
        }
    ];

    let quizData = [];
    const userAnswers = {};
    const totalPossiblePoints = rawQuizData.reduce((sum, q) => sum + q.points, 0);

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        if (!container) return;
        
        container.innerHTML = ''; 
        quizData = shuffleArray([...rawQuizData]);

        const questionsPerPage = 3;
        const totalPages = Math.ceil(quizData.length / questionsPerPage);

        for (let i = 0; i < totalPages; i++) {
            const stepDiv = document.createElement('div');
            stepDiv.className = `step ${i === 0 ? 'active' : ''}`;
            stepDiv.id = `step-${i}`;

            const startIdx = i * questionsPerPage;
            const endIdx = Math.min(startIdx + questionsPerPage, quizData.length);
            const pageQuestions = quizData.slice(startIdx, endIdx);

            let html = ``;
            
            pageQuestions.forEach((q, indexOnPage) => {
                const displayNum = startIdx + indexOnPage + 1;

                html += `
                <div class="card">
                    <div class="meta-tags">
                        <span class="video-tag">${q.video}</span>
                        <span class="category-tag">${q.category}</span>
                    </div>
                    <p class="question-text"><strong>${displayNum}.</strong> ${q.text}</p>
                    <div class="options">
                        ${q.options.map((opt, idx) => `
                            <label class="option-label">
                                <input type="radio" name="q${q.id}" value="${idx}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            });

            if (i < totalPages - 1) {
                html += `<button type="button" class="btn" onclick="nextStep(${i})">Lanjut ke Halaman Berikutnya</button>`;
            } else {
                html += `<button type="button" class="btn" style="background-color: #4caf50; color: white;" onclick="finishQuiz()">Kirim & Lihat Nilai Akhir</button>`;
            }

            stepDiv.innerHTML = html;
            container.appendChild(stepDiv);
        }

        const resultDiv = document.createElement('div');
        resultDiv.id = 'result-step';
        resultDiv.className = 'step';
        container.appendChild(resultDiv);
    }

    function nextStep(currentStepIndex) {
        const stepDiv = document.getElementById(`step-${currentStepIndex}`);
        const inputs = stepDiv.querySelectorAll('input[type="radio"]');
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        let allAnswered = true;
        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("Harap jawab semua soal di halaman ini sebelum melanjutkan.");
            return;
        }

        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        document.getElementById(`step-${currentStepIndex}`).classList.remove('active');
        document.getElementById(`step-${currentStepIndex + 1}`).classList.add('active');
        window.scrollTo(0,0);
    }

    function finishQuiz() {
        const inputs = document.querySelectorAll('.step.active input[type="radio"]');
        let allAnswered = true;
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("Harap jawab semua soal sebelum mengirimkan jawaban.");
            return;
        }

        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        calculateAndShowResults();
    }

    function calculateAndShowResults() {
        let earnedPoints = 0;
        let correctCount = 0;
        let reviewHTML = '';

        quizData.forEach((q, index) => {
            const userAnswer = userAnswers[q.id];
            const isCorrect = userAnswer === q.correct;
            
            if (isCorrect) {
                earnedPoints += q.points;
                correctCount++;
            }

            const statusClass = isCorrect ? 'correct' : 'wrong';
            const statusIcon = isCorrect ? '✅ BENAR' : '❌ SALAH';
            const pointDisplay = isCorrect ? `(+${q.points} Poin)` : `(0 Poin)`;

            reviewHTML += `
            <div class="review-item ${statusClass}">
                <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 5px;">
                    Soal #${index + 1} | ${q.category}
                </div>
                <div style="font-weight: bold; margin-bottom: 10px; font-size: 1.15rem;">${q.text}</div>
                
                <div style="margin-bottom: 8px; color: ${isCorrect ? '#4caf50' : '#f44336'}; font-weight:bold;">
                    ${statusIcon} ${pointDisplay} <br>
                    <span style="font-weight:normal; color:#ddd;">Jawaban Anda: ${q.options[userAnswer]}</span>
                </div>
                
                ${!isCorrect ? `<div style="color: #4caf50; font-size: 1rem; margin-bottom:10px;"><strong>Jawaban Benar:</strong> ${q.options[q.correct]}</div>` : ''}
                
                <div class="review-explanation">
                    <span class="indonesian-flag">🇮🇩 PENJELASAN:</span>
                    <p class="explanation-text" style="white-space: pre-wrap;">${q.explanation}</p>
                </div>
            </div>`;
        });

        const finalPercentage = Math.round((earnedPoints / totalPossiblePoints) * 100);

        const resultContainer = document.getElementById('result-step');
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        resultContainer.classList.add('active');

        // Added the explicit "Back to Dashboard / Menu Utama" button here
        resultContainer.innerHTML = `
            <div class="card result-box">
                <h2>Kuis Selesai!</h2>
                <div class="score-circle">
                    <span class="score-number">${finalPercentage}%</span>
                    <span class="score-label">Skor Akhir</span>
                </div>
                <p style="font-size:1.2rem;">Total Poin: <strong style="color:#4da6ff">${earnedPoints}</strong> / ${totalPossiblePoints}</p>
                <p style="color:#aaa;">Jawaban Benar: ${correctCount} dari ${quizData.length} soal</p>
                
                <div style="margin-top: 25px; display: flex; gap: 10px; flex-direction: column;">
                    <button type="button" class="btn" onclick="location.reload()">🔄 Kerjakan Ulang Kuis</button>
                    <button type="button" class="btn btn-dashboard" onclick="window.location.href='index.html'">🏠 Kembali ke Menu Utama (Dashboard)</button>
                </div>
            </div>
            
            <h3 style="margin-top: 40px; border-bottom: 1px solid #444; padding-bottom: 15px; text-align: left;">Ulasan & Penjelasan</h3>
            ${reviewHTML}
            
            <button type="button" class="btn btn-nav" onclick="window.scrollTo(0,0)" style="margin-top:30px;">⬆ Kembali ke Atas</button>
        `;

        window.scrollTo(0,0);
    }

    document.addEventListener('DOMContentLoaded', initQuiz);

</script>

</body>
</html>
