<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOU Module 25 Simulation (Randomized & Visualized)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #4da6ff;
            --correct-color: #4caf50;
            --wrong-color: #f44336;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--accent-color); }
        p.subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px; }

        /* Card Style */
        .card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .meta-tags {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }

        .video-tag {
            background-color: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .category-tag {
            background-color: #2c3e50;
            color: #4da6ff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #4da6ff;
        }

        .question-text {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .option-label:hover {
            background-color: #2c2c2c;
            border-color: var(--accent-color);
        }

        .option-label input {
            margin-top: 5px;
            margin-right: 15px;
            accent-color: var(--accent-color);
            transform: scale(1.2);
        }

        /* Buttons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        
        .btn-nav {
            background-color: #333; 
            color: #fff; 
            border: 1px solid #555;
            margin-bottom: 15px;
        }

        .btn:hover { opacity: 0.9; }

        /* Dashboard Button Highlight */
        .btn-dashboard {
            background-color: #ff9800;
            color: #fff;
        }
        .btn-dashboard:hover {
            background-color: #e68a00;
        }

        /* Results & Review */
        .result-box {
            text-align: center;
            padding: 40px;
        }
        
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 5px solid var(--accent-color);
        }

        .score-number { font-size: 2.2rem; font-weight: bold; color: var(--accent-color); }
        .score-label { font-size: 0.8rem; color: #aaa; margin-top: -5px; }

        .review-item {
            background-color: #252525;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 6px solid #555;
            text-align: left;
        }

        .review-item.correct { border-left-color: var(--correct-color); }
        .review-item.wrong { border-left-color: var(--wrong-color); }

        .review-explanation {
            background-color: #333; 
            border: 1px solid #FFD700; 
            padding: 15px; 
            margin-top: 15px; 
            border-radius: 8px;
        }
        
        .indonesian-flag {
            font-size: 0.95rem;
            color: #FFD700; 
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .explanation-text {
            color: #fff;
            margin: 0;
            font-size: 1rem;
            line-height: 1.5;
        }

        .step { display: none; }
        .step.active { display: block; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>IOU Module 25 Simulation</h1>
        <p class="subtitle">Summarizing Techniques</p>
    </header>

    <form id="quizForm">
        <div id="quiz-container">
            <p style="text-align:center; color: #666;">Memuat soal...</p>
        </div>
    </form>
</div>

<script>
    const rawQuizData = [
        {
            id: 1,
            video: "Video 25e",
            category: "C3 - Menerapkan (30 Poin)",
            points: 30,
            text: "You are tasked with summarizing the history of US public transportation. Applying the summary guidelines, which of the following is the most appropriate opening sentence for the text about General Motors and streetcars?",
            options: [
                "I think General Motors did a terrible thing by destroying the clean electric streetcars.",
                "Electric streetcars were clean and comfortable, but GM replaced them with buses.",
                "The passage discusses how General Motors conspired to replace electric streetcars with buses in the US.",
                "General Motors created several front companies in 1936 to dismantle the trolley car system."
            ],
            correct: 2, 
            explanation: "Jawaban Benar: C\n\n[Image showing example of objective summary vs subjective opinion]\n\nOpsi C mengaplikasikan aturan 'bahasa ringkasan' (menggunakan frasa penanda seperti 'The passage discusses...') dan secara objektif memadatkan poin utama artikel tanpa memasukkan opini pribadi seperti pada opsi A."
        },
        {
            id: 2,
            video: "Video 25a",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "What is the recommended length of the first draft of a summary compared to the original article?",
            options: [
                "Exactly half the length of the original article.",
                "Approximately one-quarter of the original length.",
                "The same length but using different vocabulary.",
                "Approximately three-quarters of the original length."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\n[Image comparing the length of original text vs summary draft]\n\nTeks secara eksplisit menyebutkan bahwa target draf pertama kira-kira 1/4 (seperempat) dari panjang aslinya untuk memastikan hanya poin utama yang masuk."
        },
        {
            id: 3,
            video: "Video 25e",
            category: "C2 - Memahami (20 Poin)",
            points: 20,
            text: "Based on the passage, what was General Motors' primary motivation for dismantling the electric trolley system?",
            options: [
                "To reduce traffic congestion in large cities.",
                "To make public transportation less desirable and increase automobile sales.",
                "To provide a cleaner and more comfortable public transportation option.",
                "To support labor unions that were striking against the trolley operators."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\nTeks menyatakan bahwa beberapa pihak menduga mereka ingin mengganti troli dengan bus agar angkutan umum menjadi kurang diminati, sehingga penjualan mobil pribadi mereka akan meningkat."
        },
        {
            id: 4,
            video: "Video 25b",
            category: "C3 - Menerapkan (30 Poin)",
            points: 30,
            text: "If a student is writing a summary about the Experience Corps, which of the following sentences correctly applies the rule of paraphrasing to avoid plagiarism?",
            options: [
                "'Many children struggle with reading and writing in 19 cities.'",
                "'Volunteers who are over 50 years old teach students in low-income areas.'",
                "'Older volunteers help poor children improve their literacy skills.'",
                "'The volunteers help children learn to read and write in the poorest countries.'"
            ],
            correct: 2, 
            explanation: "Jawaban Benar: C\n\n[Image showing side-by-side comparison of original text and paraphrased text]\n\nOpsi C mengaplikasikan teknik parafrase dengan baik. Frasa 'reading and writing' diubah menjadi 'improve their literacy skills' dan struktur kalimatnya diubah total tanpa mengubah makna inti, berbeda dengan opsi A dan B yang menyalin mentah-mentah."
        },
        {
            id: 5,
            video: "Video 25d",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "What is the primary power source for the TGV trains in France?",
            options: [
                "Gasoline",
                "Diesel",
                "Electricity",
                "Coal"
            ],
            correct: 2, 
            explanation: "Jawaban Benar: C\n\nDalam video disebutkan bahwa hal yang mengejutkan tentang TGV adalah kereta tersebut beroperasi menggunakan tenaga listrik (electricity), bukan bahan bakar fosil lainnya."
        },
        {
            id: 6,
            video: "Video 25a",
            category: "C2 - Memahami (20 Poin)",
            points: 20,
            text: "Why is it strictly prohibited to include phrases like 'I think' in a summary?",
            options: [
                "Because summaries require a high level of advanced vocabulary rather than basic phrases.",
                "Because a summary must remain strictly objective and not include the writer's personal opinions.",
                "Because the original author's opinions are always factual and cannot be debated.",
                "Because a summary must include personal interpretations to make it engaging for readers."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\nAturan dasar menulis ringkasan adalah objektivitas. Penulis ringkasan sama sekali tidak boleh memasukkan ide, pendapat, atau interpretasi pribadi. Kita hanya bertugas melaporkan kembali apa yang dikatakan penulis asli."
        },
        {
            id: 7,
            video: "Video 25a",
            category: "C3 - Menerapkan (30 Poin)",
            points: 30,
            text: "A student highlights an entire paragraph of an original text before taking notes for a summary. Based on the rules of summarizing, what is the most likely consequence of this action?",
            options: [
                "The student will easily memorize the exact phrasing of the author.",
                "The student will have difficulty making concise notes and might end up plagiarizing.",
                "The student will automatically create a highly accurate and objective summary.",
                "The student will be able to write a draft without looking at their notes."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\nAturan dalam materi menjelaskan bahwa kita dilarang menyorot seluruh kalimat atau paragraf. Jika menyorot terlalu banyak, otak akan gagal menyaring poin utama, sehingga kita akan kesulitan membuat catatan ringkas dan berpotensi besar melakukan plagiarisme."
        },
        {
            id: 8,
            video: "Video 25f",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "What does the Chinese acronym 'shinobi-no-mono' literally mean?",
            options: [
                "To steal",
                "To assassinate",
                "To hide",
                "To fight"
            ],
            correct: 0, 
            explanation: "Jawaban Benar: A\n\nTeks secara eksplisit menyebutkan bahwa 'shinobi-no-mono' memiliki arti harfiah 'to steal' (mencuri)."
        },
        {
            id: 9,
            video: "Video 25b",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "According to the text, what is the main goal of the 10,000 Women Initiative?",
            options: [
                "To provide older volunteers to teach children how to read.",
                "To help female entrepreneurs in developing countries understand business foundations.",
                "To send young boys to America to learn about modern developments.",
                "To discourage female entrepreneurs from opening businesses in local communities."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\nProgram ini secara spesifik disebutkan bertujuan untuk membantu pengusaha wanita memahami dunia bisnis (perencanaan, pembiayaan, jaringan) agar mereka bisa sukses di negara berkembang."
        },
        {
            id: 10,
            video: "Video 25f",
            category: "C2 - Memahami (20 Poin)",
            points: 20,
            text: "Why did the Japanese adopt and change the term 'shinobi-no-mono' to 'ninja' during the Edo period?",
            options: [
                "Because 'ninja' was a traditional Japanese word for espionage.",
                "Because 'ninja' was much quicker and easier to say.",
                "Because the word 'shinobi' was banned in Japanese poetry.",
                "Because 'ninja' is much more difficult for foreigners to understand."
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\nTeks dengan jelas menyatakan perubahan ini 'mungkin terjadi karena jauh lebih cepat dan mudah untuk mengatakan ninja saja' dibandingkan frasa aslinya."
        },
        {
            id: 11,
            video: "Video 25c",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "In what year did W.C. Coup partner with P.T. Barnum to start using locomotives for their shows?",
            options: [
                "1870",
                "1871",
                "1922",
                "1936"
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\nDi dalam teks disebutkan fakta spesifik bahwa W.C. Coup bekerja sama dengan P.T. Barnum pada tahun 1871."
        },
        {
            id: 12,
            video: "Video 25a",
            category: "C1 - Mengingat (10 Poin)",
            points: 10,
            text: "Which formatting style is required for the full bibliographic citation placed at the beginning of a summary?",
            options: [
                "MLA format",
                "APA format",
                "Chicago format",
                "Harvard format"
            ],
            correct: 1, 
            explanation: "Jawaban Benar: B\n\nInstruksi dari pengajar dalam materi sangat jelas: 'kalian harus menggunakan format APA' untuk menulis kutipan bibliografi lengkap di bagian atas ringkasan."
        }
    ];

    let quizData = [];
    const userAnswers = {};
    const totalPossiblePoints = rawQuizData.reduce((sum, q) => sum + q.points, 0);

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        if (!container) return;
        
        container.innerHTML = ''; 
        quizData = shuffleArray([...rawQuizData]);

        const questionsPerPage = 3;
        const totalPages = Math.ceil(quizData.length / questionsPerPage);

        for (let i = 0; i < totalPages; i++) {
            const stepDiv = document.createElement('div');
            stepDiv.className = `step ${i === 0 ? 'active' : ''}`;
            stepDiv.id = `step-${i}`;

            const startIdx = i * questionsPerPage;
            const endIdx = Math.min(startIdx + questionsPerPage, quizData.length);
            const pageQuestions = quizData.slice(startIdx, endIdx);

            let html = ``;
            
            pageQuestions.forEach((q, indexOnPage) => {
                const displayNum = startIdx + indexOnPage + 1;

                html += `
                <div class="card">
                    <div class="meta-tags">
                        <span class="video-tag">${q.video}</span>
                        <span class="category-tag">${q.category}</span>
                    </div>
                    <p class="question-text"><strong>${displayNum}.</strong> ${q.text}</p>
                    <div class="options">
                        ${q.options.map((opt, idx) => `
                            <label class="option-label">
                                <input type="radio" name="q${q.id}" value="${idx}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            });

            if (i < totalPages - 1) {
                html += `<button type="button" class="btn" onclick="nextStep(${i})">Lanjut ke Halaman Berikutnya</button>`;
            } else {
                html += `<button type="button" class="btn" style="background-color: #4caf50; color: white;" onclick="finishQuiz()">Kirim & Lihat Nilai Akhir</button>`;
            }

            stepDiv.innerHTML = html;
            container.appendChild(stepDiv);
        }

        const resultDiv = document.createElement('div');
        resultDiv.id = 'result-step';
        resultDiv.className = 'step';
        container.appendChild(resultDiv);
    }

    function nextStep(currentStepIndex) {
        const stepDiv = document.getElementById(`step-${currentStepIndex}`);
        const inputs = stepDiv.querySelectorAll('input[type="radio"]');
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        let allAnswered = true;
        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("Harap jawab semua soal di halaman ini sebelum melanjutkan.");
            return;
        }

        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        document.getElementById(`step-${currentStepIndex}`).classList.remove('active');
        document.getElementById(`step-${currentStepIndex + 1}`).classList.add('active');
        window.scrollTo(0,0);
    }

    function finishQuiz() {
        const inputs = document.querySelectorAll('.step.active input[type="radio"]');
        let allAnswered = true;
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("Harap jawab semua soal sebelum mengirimkan jawaban.");
            return;
        }

        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        calculateAndShowResults();
    }

    function calculateAndShowResults() {
        let earnedPoints = 0;
        let correctCount = 0;
        let reviewHTML = '';

        quizData.forEach((q, index) => {
            const userAnswer = userAnswers[q.id];
            const isCorrect = userAnswer === q.correct;
            
            if (isCorrect) {
                earnedPoints += q.points;
                correctCount++;
            }

            const statusClass = isCorrect ? 'correct' : 'wrong';
            const statusIcon = isCorrect ? '✅ BENAR' : '❌ SALAH';
            const pointDisplay = isCorrect ? `(+${q.points} Poin)` : `(0 Poin)`;

            reviewHTML += `
            <div class="review-item ${statusClass}">
                <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 5px;">
                    Soal #${index + 1} | ${q.category}
                </div>
                <div style="font-weight: bold; margin-bottom: 10px; font-size: 1.15rem;">${q.text}</div>
                
                <div style="margin-bottom: 8px; color: ${isCorrect ? '#4caf50' : '#f44336'}; font-weight:bold;">
                    ${statusIcon} ${pointDisplay} <br>
                    <span style="font-weight:normal; color:#ddd;">Jawaban Anda: ${q.options[userAnswer]}</span>
                </div>
                
                ${!isCorrect ? `<div style="color: #4caf50; font-size: 1rem; margin-bottom:10px;"><strong>Jawaban Benar:</strong> ${q.options[q.correct]}</div>` : ''}
                
                <div class="review-explanation">
                    <span class="indonesian-flag">🇮🇩 PENJELASAN:</span>
                    <p class="explanation-text" style="white-space: pre-wrap;">${q.explanation}</p>
                </div>
            </div>`;
        });

        const finalPercentage = Math.round((earnedPoints / totalPossiblePoints) * 100);

        const resultContainer = document.getElementById('result-step');
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        resultContainer.classList.add('active');

        // Added the explicit "Back to Dashboard / Menu Utama" button here
        resultContainer.innerHTML = `
            <div class="card result-box">
                <h2>Kuis Selesai!</h2>
                <div class="score-circle">
                    <span class="score-number">${finalPercentage}%</span>
                    <span class="score-label">Skor Akhir</span>
                </div>
                <p style="font-size:1.2rem;">Total Poin: <strong style="color:#4da6ff">${earnedPoints}</strong> / ${totalPossiblePoints}</p>
                <p style="color:#aaa;">Jawaban Benar: ${correctCount} dari ${quizData.length} soal</p>
                
                <div style="margin-top: 25px; display: flex; gap: 10px; flex-direction: column;">
                    <button type="button" class="btn" onclick="location.reload()">🔄 Kerjakan Ulang Kuis</button>
                    <button type="button" class="btn btn-dashboard" onclick="window.location.href='index.html'">🏠 Kembali ke Menu Utama (Dashboard)</button>
                </div>
            </div>
            
            <h3 style="margin-top: 40px; border-bottom: 1px solid #444; padding-bottom: 15px; text-align: left;">Ulasan & Penjelasan</h3>
            ${reviewHTML}
            
            <button type="button" class="btn btn-nav" onclick="window.scrollTo(0,0)" style="margin-top:30px;">⬆ Kembali ke Atas</button>
        `;

        window.scrollTo(0,0);
    }

    document.addEventListener('DOMContentLoaded', initQuiz);

</script>

</body>
</html>
