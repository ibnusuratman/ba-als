<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOU Module 14 Simulation (Randomized)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #4da6ff;
            --correct-color: #4caf50;
            --wrong-color: #f44336;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--accent-color); }
        p.subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px; }

        /* Card Style */
        .card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .meta-tags {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }

        .video-tag {
            background-color: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .category-tag {
            background-color: #2c3e50;
            color: #4da6ff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #4da6ff;
        }

        .question-text {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .option-label:hover {
            background-color: #2c2c2c;
            border-color: var(--accent-color);
        }

        .option-label input {
            margin-top: 5px;
            margin-right: 15px;
            accent-color: var(--accent-color);
            transform: scale(1.2);
        }

        /* Buttons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        
        .btn-nav {
            background-color: #333; 
            color: #fff; 
            border: 1px solid #555;
            margin-bottom: 15px;
        }

        .btn:hover { opacity: 0.9; }

        /* Results & Review */
        .result-box {
            text-align: center;
            padding: 40px;
        }
        
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 5px solid var(--accent-color);
        }

        .score-number { font-size: 2.2rem; font-weight: bold; color: var(--accent-color); }
        .score-label { font-size: 0.8rem; color: #aaa; margin-top: -5px; }

        .review-item {
            background-color: #252525;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 6px solid #555;
            text-align: left;
        }

        .review-item.correct { border-left-color: var(--correct-color); }
        .review-item.wrong { border-left-color: var(--wrong-color); }

        .review-explanation {
            background-color: #333; 
            border: 1px solid #FFD700; 
            padding: 15px; 
            margin-top: 15px; 
            border-radius: 8px;
        }
        
        .indonesian-flag {
            font-size: 0.95rem;
            color: #FFD700; 
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .explanation-text {
            color: #fff;
            margin: 0;
            font-size: 1rem;
            line-height: 1.5;
        }

        .step { display: none; }
        .step.active { display: block; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>IOU Module 14 Simulation</h1>
        <p class="subtitle">Drafting & Thesis Statements</p>
    </header>

    <form id="quizForm">
        <div id="quiz-container">
            <p style="text-align:center; color: #666;">Loading questions...</p>
        </div>
    </form>
</div>

<script>
    // DATA SOAL MODUL 14
    // 6 C1 (10pt), 3 C2 (20pt), 3 C3 (30pt)
    
    const rawQuizData = [
        // --- C1: REMEMBERING (10 Poin) ---
        {
            id: 1,
            video: "Video 14a: Drafting Process",
            category: "C1 - Mengingat",
            points: 10,
            text: "According to the drafting process described, what is the primary focus when writing a rough draft?",
            options: [
                "To correct all spelling and grammatical errors immediately.",
                "To consult a dictionary for the perfect word choice.",
                "To let ideas flow without stopping to revise or edit.",
                "To write the final version of the essay in one attempt."
            ],
            correct: 2, 
            explanation: "Video 14a secara eksplisit menyatakan bahwa saat menulis draf kasar, fokuslah untuk membiarkan ide mengalir (let ideas flow) dan jangan mencoba merevisi atau mengedit pada waktu yang sama."
        },
        {
            id: 3,
            video: "Video 14c: Paragraph Metaphors",
            category: "C1 - Mengingat",
            points: 10,
            text: "In the metaphor comparing a paragraph to a house, what do the 'walls' represent?",
            options: [
                "The topic sentence that covers the main idea.",
                "The supporting details, evidence, and proof.",
                "The concluding sentence that wraps up the paragraph.",
                "The title of the essay or paragraph."
            ],
            correct: 1, 
            explanation: " Dalam metafora di Video 14c, 'Atap' adalah kalimat topik, sedangkan 'Dinding' (walls) adalah detail pendukung (supporting details), bukti, atau informasi yang menopang atap tersebut."
        },
        {
            id: 5,
            video: "Video 14e: Thesis Location",
            category: "C1 - Mengingat",
            points: 10,
            text: "Where is the thesis statement typically located in an academic essay?",
            options: [
                "It is the very first sentence of the introduction.",
                "It is usually the last sentence of the introductory paragraph.",
                "It appears only in the conclusion paragraph.",
                "It can be placed anywhere in the body paragraphs."
            ],
            correct: 1, 
            explanation: " Video 14e menyebutkan bahwa pernyataan tesis biasanya adalah kalimat terakhir dari paragraf pengantar (introductory paragraph)."
        },
        {
            id: 7,
            video: "Video 14f: Thesis Formula",
            category: "C1 - Mengingat",
            points: 10,
            text: "Which simple formula is used to construct a thesis statement?",
            options: [
                "Topic + Fact = Thesis",
                "Subject + Verb = Thesis",
                "Topic + Opinion = Thesis",
                "Title + Announcement = Thesis"
            ],
            correct: 2, 
            explanation: "Video 14f ('Writing with Dave') memberikan rumus sederhana: Topic + Opinion = Thesis. Fakta atau Pengumuman tidak bisa dijadikan tesis."
        },
        {
            id: 10,
            video: "Video 14f: Valid Thesis",
            category: "C1 - Mengingat",
            points: 10,
            text: "Which of the following is NOT a characteristic of a valid thesis statement?",
            options: [
                "It creates a unifying concept for the essay.",
                "It acts as an announcement (e.g., 'My subject is...').",
                "It passes the 'So What?' test.",
                "It takes a position that others might challenge."
            ],
            correct: 1, 
            explanation: "Video 14f secara spesifik menyatakan 'Thesis is NOT an announcement' (Tesis bukan pengumuman). Jangan mengatakan 'Subjek saya adalah...' atau 'Saya ingin membahas...'."
        },
        {
            id: 12,
            video: "Video 14a: Paragraph Length",
            category: "C1 - Mengingat",
            points: 10,
            text: "What is the typical length of a standard paragraph as described in the material?",
            options: [
                "10 to 30 words.",
                "50 to 200 words.",
                "300 to 500 words.",
                "There is no specific length guideline."
            ],
            correct: 1, 
            explanation: "Video 14a menyebutkan bahwa paragraf secara umum biasanya terdiri dari kira-kira 50 sampai 200 kata."
        },

        // --- C2: UNDERSTANDING (20 Poin) ---
        {
            id: 4,
            video: "Video 14a: Topic Sentences",
            category: "C2 - Memahami",
            points: 20,
            text: "Why is the sentence 'Ottawa is the capital of Canada' considered an inappropriate topic sentence?",
            options: [
                "Because it is a vague opinion that cannot be proven.",
                "Because it is an obvious fact that leaves nothing to accept or argue.",
                "Because it is too controversial for an academic paper.",
                "Because it contains grammatical errors."
            ],
            correct: 1, 
            explanation: "Video 14a menjelaskan bahwa kalimat topik tidak boleh berupa fakta yang sudah jelas (obvious fact) karena tidak ada yang bisa dikembangkan atau diperdebatkan dari fakta tersebut."
        },
        {
            id: 8,
            video: "Video 14f: Thesis Roadmap",
            category: "C2 - Memahami",
            points: 20,
            text: "What does it mean when a thesis statement acts as a 'roadmap'?",
            options: [
                "It lists the exact page numbers where information can be found.",
                "It creates a prediction or outline of the points that will be discussed in the essay.",
                "It explains the geographical location of the topic being discussed.",
                "It serves as a title that attracts the reader's attention."
            ],
            correct: 1, 
            explanation: "Video 14f menjelaskan bahwa tesis menciptakan 'peta jalan' (roadmap) yang memprediksi apa yang akan dibahas selanjutnya. Jika tesis menyebutkan 3 alasan, esai harus membahas 3 alasan tersebut."
        },
        {
            id: 11,
            video: "Video 14e: Types of Thesis",
            category: "C2 - Memahami",
            points: 20,
            text: "How does an argumentative thesis statement differ from an analytical one?",
            options: [
                "An argumentative thesis makes a claim to convince the audience, while an analytical thesis breaks down a specific issue.",
                "An argumentative thesis states facts, while an analytical thesis gives opinions.",
                "An argumentative thesis is always at the end, while an analytical thesis is at the beginning.",
                "There is no difference; they are interchangeable terms."
            ],
            correct: 0, 
            explanation: "Video 14e menjelaskan bahwa makalah argumentatif bertujuan meyakinkan audiens akan kebenaran klaim, sedangkan analitis memecah masalah menjadi bagian-bagian (analisis komponen)."
        },

        // --- C3: APPLYING (30 Poin) ---
        {
            id: 2,
            video: "Video 14f: Strongest Thesis",
            category: "C3 - Menerapkan",
            points: 30,
            text: "Which of the following represents the STRONGEST thesis statement based on the 'Writing with Dave' guidelines?",
            options: [
                "The minimum wage in the United States.",
                "I am going to write about why the minimum wage is important.",
                "The minimum wage should be raised to a living wage because it benefits individuals, businesses, and the economy.",
                "Surveys show that many people want a higher minimum wage in the United States."
            ],
            correct: 2, 
            explanation: "Berdasarkan Video 14f, tesis yang kuat harus spesifik dan memiliki argumen (Topik + Opini). Opsi C menyatakan posisi yang jelas (harus dinaikkan) dan memberikan peta jalan (roadmap)."
        },
        {
            id: 6,
            video: "Video 14b: Identifying Topic Sentences",
            category: "C3 - Menerapkan",
            points: 30,
            text: "Read the following paragraph and identify the most accurate Topic Sentence: 'You can try counting sheep or occupying your mind with a repetitive activity. Sometimes listening to soft sounds like rain or reading a book can help. You can even try telling yourself a story to distract your mind.'",
            options: [
                "Sometimes it is very hard to sleep at night.",
                "Counting sheep is the best way to fall asleep.",
                "There are several things you can do to try to sleep.",
                "Sleep disorders are a major problem in modern society."
            ],
            correct: 2, 
            explanation: "Dalam contoh kalimat ini (materi insomnia), 'Ada beberapa hal yang dapat Anda lakukan untuk mencoba tidur' adalah payung gagasan yang merangkum contoh-contoh spesifik di dalam paragraf."
        },
        {
            id: 9,
            video: "Video 14d: Paragraph Analysis",
            category: "C3 - Menerapkan",
            points: 30,
            text: "Analyze the sentence: 'Keep at least two screwdrivers, one Flathead and one Phillips head.' In the context of a paragraph about a useful toolbox, how is this sentence classified?",
            options: [
                "It is a Topic Sentence (TS) because it gives advice.",
                "It is a Supporting Detail (SD) because it provides a specific example of items in a toolbox.",
                "It is a Thesis Statement because it expresses an opinion.",
                "It is a Concluding Sentence because it summarizes the tools."
            ],
            correct: 1, 
            explanation: "Dalam latihan Video 14d, kalimat tentang jenis obeng ini diklasifikasikan sebagai Supporting Detail (SD) karena merupakan contoh spesifik (bukti/detail pendukung) dari kalimat topik utama."
        }
    ];

    // Array untuk soal yang sudah diacak
    let quizData = [];
    const userAnswers = {};
    const totalPossiblePoints = rawQuizData.reduce((sum, q) => sum + q.points, 0);

    // Fungsi Pengacak (Fisher-Yates Shuffle)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        if (!container) return;
        
        container.innerHTML = ''; 
        
        // 1. Acak Soal
        quizData = shuffleArray([...rawQuizData]);

        // 2. Bagi menjadi halaman (3 soal per halaman)
        const questionsPerPage = 3;
        const totalPages = Math.ceil(quizData.length / questionsPerPage);

        for (let i = 0; i < totalPages; i++) {
            const stepDiv = document.createElement('div');
            stepDiv.className = `step ${i === 0 ? 'active' : ''}`;
            stepDiv.id = `step-${i}`;

            const startIdx = i * questionsPerPage;
            const endIdx = Math.min(startIdx + questionsPerPage, quizData.length);
            const pageQuestions = quizData.slice(startIdx, endIdx);

            let html = ``;
            
            pageQuestions.forEach((q, indexOnPage) => {
                const displayNum = startIdx + indexOnPage + 1;

                html += `
                <div class="card">
                    <div class="meta-tags">
                        <span class="video-tag">${q.video}</span>
                        <span class="category-tag">${q.category} (${q.points} Poin)</span>
                    </div>
                    <p class="question-text"><strong>${displayNum}.</strong> ${q.text}</p>
                    <div class="options">
                        ${q.options.map((opt, idx) => `
                            <label class="option-label">
                                <input type="radio" name="q${q.id}" value="${idx}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            });

            // Tombol Navigasi
            if (i < totalPages - 1) {
                html += `<button type="button" class="btn" onclick="nextStep(${i})">Next Section</button>`;
            } else {
                html += `<button type="button" class="btn" style="background-color: #4caf50; color: white;" onclick="finishQuiz()">Submit & See Score</button>`;
            }

            stepDiv.innerHTML = html;
            container.appendChild(stepDiv);
        }

        // Halaman Hasil
        const resultDiv = document.createElement('div');
        resultDiv.id = 'result-step';
        resultDiv.className = 'step';
        container.appendChild(resultDiv);
    }

    function nextStep(currentStepIndex) {
        const stepDiv = document.getElementById(`step-${currentStepIndex}`);
        const inputs = stepDiv.querySelectorAll('input[type="radio"]');
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        let allAnswered = true;
        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("Please answer all questions before proceeding.");
            return;
        }

        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        document.getElementById(`step-${currentStepIndex}`).classList.remove('active');
        document.getElementById(`step-${currentStepIndex + 1}`).classList.add('active');
        window.scrollTo(0,0);
    }

    function finishQuiz() {
        const inputs = document.querySelectorAll('.step.active input[type="radio"]');
        let allAnswered = true;
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("Please answer all questions before submitting.");
            return;
        }

        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        calculateAndShowResults();
    }

    function calculateAndShowResults() {
        let earnedPoints = 0;
        let correctCount = 0;
        let reviewHTML = '';

        quizData.forEach((q, index) => {
            const userAnswer = userAnswers[q.id];
            const isCorrect = userAnswer === q.correct;
            
            if (isCorrect) {
                earnedPoints += q.points;
                correctCount++;
            }

            const statusClass = isCorrect ? 'correct' : 'wrong';
            const statusIcon = isCorrect ? '✅ BENAR' : '❌ SALAH';
            const pointDisplay = isCorrect ? `(+${q.points} Poin)` : `(0 Poin)`;

            reviewHTML += `
            <div class="review-item ${statusClass}">
                <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 5px;">
                    Soal #${index + 1} | ${q.category} | Nilai: ${q.points}
                </div>
                <div style="font-weight: bold; margin-bottom: 10px; font-size: 1.1rem;">${q.text}</div>
                
                <div style="margin-bottom: 8px; color: ${isCorrect ? '#4caf50' : '#f44336'}; font-weight:bold;">
                    ${statusIcon} ${pointDisplay} <br>
                    <span style="font-weight:normal; color:#ddd;">Jawaban Anda: ${q.options[userAnswer]}</span>
                </div>
                
                ${!isCorrect ? `<div style="color: #4caf50; font-size: 0.95rem; margin-bottom:10px;"><strong>Jawaban Benar:</strong> ${q.options[q.correct]}</div>` : ''}
                
                <div class="review-explanation">
                    <span class="indonesian-flag">🇮🇩 PENJELASAN:</span>
                    <p class="explanation-text">${q.explanation}</p>
                </div>
            </div>`;
        });

        const finalPercentage = Math.round((earnedPoints / totalPossiblePoints) * 100);

        const resultContainer = document.getElementById('result-step');
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        resultContainer.classList.add('active');

        resultContainer.innerHTML = `
            <div class="card result-box">
                <h2>Quiz Completed!</h2>
                <div class="score-circle">
                    <span class="score-number">${finalPercentage}%</span>
                    <span class="score-label">Score</span>
                </div>
                <p style="font-size:1.2rem;">Total Poin: <strong style="color:#4da6ff">${earnedPoints}</strong> / ${totalPossiblePoints}</p>
                <p style="color:#aaa;">Jawaban Benar: ${correctCount} dari ${quizData.length} soal</p>
            </div>

            <button type="button" class="btn btn-nav" onclick="window.location.href='index.html'">⬅ Kembali ke Menu Utama</button>
            <button type="button" class="btn" onclick="location.reload()">🔄 Kerjakan Ulang (Soal Diacak)</button>
            
            <h3 style="margin-top: 40px; border-bottom: 1px solid #444; padding-bottom: 15px;">Review & Explanation (Bahasa Indonesia)</h3>
            ${reviewHTML}
            
            <button type="button" class="btn btn-nav" onclick="window.scrollTo(0,0)" style="margin-top:30px;">⬆ Kembali ke Atas</button>
        `;

        window.scrollTo(0,0);
    }

    document.addEventListener('DOMContentLoaded', initQuiz);

</script>

</body>
</html>
