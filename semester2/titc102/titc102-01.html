<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #4da6ff;
            --correct-color: #4caf50;
            --wrong-color: #f44336;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            direction: rtl;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--accent-color); }
        p.subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px; }

        /* Card Style */
        .card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .meta-tags {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }

        .video-tag {
            background-color: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .category-tag {
            background-color: #2c3e50;
            color: #4da6ff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #4da6ff;
        }

        .question-text {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .option-label:hover {
            background-color: #2c2c2c;
            border-color: var(--accent-color);
        }

        .option-label input {
            margin-top: 5px;
            margin-left: 15px;
            margin-right: 0;
            accent-color: var(--accent-color);
            transform: scale(1.2);
        }

        /* Buttons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        
        .btn-nav {
            background-color: #333; 
            color: #fff; 
            border: 1px solid #555;
            margin-bottom: 15px;
        }

        .btn:hover { opacity: 0.9; }

        /* Results & Review */
        .result-box {
            text-align: center;
            padding: 40px;
        }
        
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 5px solid var(--accent-color);
        }

        .score-number { font-size: 2.2rem; font-weight: bold; color: var(--accent-color); }
        .score-label { font-size: 0.8rem; color: #aaa; margin-top: -5px; }

        .review-item {
            background-color: #252525;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-right: 6px solid #555;
            text-align: right;
        }

        .review-item.correct { border-right-color: var(--correct-color); }
        .review-item.wrong { border-right-color: var(--wrong-color); }

        .review-explanation {
            background-color: #333; 
            border: 1px solid #FFD700; 
            padding: 15px; 
            margin-top: 15px; 
            border-radius: 8px;
            direction: ltr;
            text-align: left;
        }
        
        .indonesian-flag {
            font-size: 0.95rem;
            color: #FFD700; 
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .explanation-text {
            color: #fff;
            margin: 0;
            font-size: 1rem;
            line-height: 1.5;
        }

        .step { display: none; }
        .step.active { display: block; }

    </style>

    // Array untuk soal yang sudah diacak
    let quizData = [];
    const userAnswers = {};
    const totalPossiblePoints = rawQuizData.reduce((sum, q) => sum + q.points, 0);

    // Fungsi Pengacak (Fisher-Yates Shuffle)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        if (!container) return;
        
        container.innerHTML = ''; 
        
        // 1. Acak Soal
        quizData = shuffleArray([...rawQuizData]);

        // 2. Bagi menjadi halaman (3 soal per halaman)
        const questionsPerPage = 3;
        const totalPages = Math.ceil(quizData.length / questionsPerPage);

        for (let i = 0; i < totalPages; i++) {
            const stepDiv = document.createElement('div');
            stepDiv.className = `step ${i === 0 ? 'active' : ''}`;
            stepDiv.id = `step-${i}`;

            const startIdx = i * questionsPerPage;
            const endIdx = Math.min(startIdx + questionsPerPage, quizData.length);
            const pageQuestions = quizData.slice(startIdx, endIdx);

            let html = ``;
            
            pageQuestions.forEach((q, indexOnPage) => {
                const displayNum = startIdx + indexOnPage + 1;

                html += `
                <div class="card">
                    <div class="meta-tags">
                        <span class="video-tag">${q.video}</span>
                        <span class="category-tag">${q.category}</span>
                    </div>
                    <p class="question-text"><strong>${displayNum}.</strong> ${q.text}</p>
                    <div class="options">
                        ${q.options.map((opt, idx) => `
                            <label class="option-label">
                                <input type="radio" name="q${q.id}" value="${idx}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            });

            // Tombol Navigasi
            if (i < totalPages - 1) {
                html += `<button type="button" class="btn" onclick="nextStep(${i})">التالي (Next Section)</button>`;
            } else {
                html += `<button type="button" class="btn" style="background-color: #4caf50; color: white;" onclick="finishQuiz()">إرسال وعرض النتيجة (Submit)</button>`;
            }

            stepDiv.innerHTML = html;
            container.appendChild(stepDiv);
        }

        // Halaman Hasil
        const resultDiv = document.createElement('div');
        resultDiv.id = 'result-step';
        resultDiv.className = 'step';
        container.appendChild(resultDiv);
    }

    function nextStep(currentStepIndex) {
        const stepDiv = document.getElementById(`step-${currentStepIndex}`);
        const inputs = stepDiv.querySelectorAll('input[type="radio"]');
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        let allAnswered = true;
        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("يرجى الإجابة على جميع الأسئلة قبل المتابعة.");
            return;
        }

        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        document.getElementById(`step-${currentStepIndex}`).classList.remove('active');
        document.getElementById(`step-${currentStepIndex + 1}`).classList.add('active');
        window.scrollTo(0,0);
    }

    function finishQuiz() {
        const inputs = document.querySelectorAll('.step.active input[type="radio"]');
        let allAnswered = true;
        const questionsOnPage = new Set();
        inputs.forEach(input => questionsOnPage.add(input.name));

        questionsOnPage.forEach(name => {
            if (!document.querySelector(`input[name="${name}"]:checked`)) {
                allAnswered = false;
            }
        });

        if (!allAnswered) {
            alert("يرجى الإجابة على جميع الأسئلة قبل الإرسال.");
            return;
        }

        inputs.forEach(input => {
            if (input.checked) {
                const qId = parseInt(input.name.substring(1));
                userAnswers[qId] = parseInt(input.value);
            }
        });

        calculateAndShowResults();
    }

    function calculateAndShowResults() {
        let earnedPoints = 0;
        let correctCount = 0;
        let reviewHTML = '';

        quizData.forEach((q, index) => {
            const userAnswer = userAnswers[q.id];
            const isCorrect = userAnswer === q.correct;
            
            if (isCorrect) {
                earnedPoints += q.points;
                correctCount++;
            }

            const statusClass = isCorrect ? 'correct' : 'wrong';
            const statusIcon = isCorrect ? '✅ صحيح (Benar)' : '❌ خطأ (Salah)';
            const pointDisplay = isCorrect ? `(+${q.points} Poin)` : `(0 Poin)`;

            reviewHTML += `
            <div class="review-item ${statusClass}">
                <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 5px;">
                    السؤال #${index + 1} | ${q.category}
                </div>
                <div style="font-weight: bold; margin-bottom: 10px; font-size: 1.1rem;">${q.text}</div>
                
                <div style="margin-bottom: 8px; color: ${isCorrect ? '#4caf50' : '#f44336'}; font-weight:bold;">
                    ${statusIcon} ${pointDisplay} <br>
                    <span style="font-weight:normal; color:#ddd;">إجابتك: ${q.options[userAnswer]}</span>
                </div>
                
                ${!isCorrect ? `<div style="color: #4caf50; font-size: 0.95rem; margin-bottom:10px;"><strong>الإجابة الصحيحة:</strong> ${q.options[q.correct]}</div>` : ''}
                
                <div class="review-explanation">
                    <span class="indonesian-flag">🇮🇩 PENJELASAN (Bahasa Indonesia):</span>
                    <p class="explanation-text">${q.explanation}</p>
                </div>
            </div>`;
        });

        const finalPercentage = Math.round((earnedPoints / totalPossiblePoints) * 100);

        const resultContainer = document.getElementById('result-step');
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        resultContainer.classList.add('active');

        resultContainer.innerHTML = `
            <div class="card result-box">
                <h2>اكتمل الاختبار! (Quiz Completed)</h2>
                <div class="score-circle">
                    <span class="score-number">${finalPercentage}%</span>
                    <span class="score-label">النتيجة</span>
                </div>
                <p style="font-size:1.2rem;">إجمالي النقاط: <strong style="color:#4da6ff">${earnedPoints}</strong> / ${totalPossiblePoints}</p>
                <p style="color:#aaa;">الإجابات الصحيحة: ${correctCount} من ${quizData.length} أسئلة</p>
            </div>

            <button type="button" class="btn" onclick="location.reload()">🔄 إعادة الاختبار (أسئلة عشوائية جديدة)</button>
            
            <h3 style="margin-top: 40px; border-bottom: 1px solid #444; padding-bottom: 15px; text-align: right;">المراجعة والتفسير (Review & Explanation)</h3>
            ${reviewHTML}
            
            <button type="button" class="btn btn-nav" onclick="window.scrollTo(0,0)" style="margin-top:30px;">⬆ العودة للأعلى</button>
        `;

        window.scrollTo(0,0);
    }

    document.addEventListener('DOMContentLoaded', initQuiz);

</script>

</body>
</html>
